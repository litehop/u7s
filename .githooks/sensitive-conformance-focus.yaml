# Registry of known-recurring-regression files and the sonobuoy --focus
# regex that MUST record a PASS before a PR touching them can merge -- enforced
# by the sensitive-e2e-guard job in .github/workflows/e2e-focus.yaml (a required
# CI check on Lima-free ubuntu runners).
#
# Why this exists: validate_pod_spec_immutable (crates/apiserver/src/
# handlers/pods.rs) regressed the same upstream conformance spec 3 times
# (PR #729, #772, #1213) while `cargo test --workspace` + clippy stayed
# green the whole time -- unit tests alone don't exercise the real
# kubelet+KCM+apiserver interaction the upstream spec does. See bd memory
# `conformance-pr-merge-gate` and the postmortem for the full
# history this registry operationalizes.
#
# SCOPE -- SINGLE-NODE ONLY. The CI guard runs a SINGLE-NODE cluster, so only
# register specs that are fully verifiable on one node (the entries below are).
# A spec that depends on multi-node topology must NOT be added here: the guard
# would either false-block or, worse, PASS spuriously without exercising the
# multi-node behavior (silent false confidence on a safety gate). Multi-node CI
# is not built today and would be a substantial effort -- such a spec needs
# local Lima multi-node verification or new CI plumbing instead. See bd memory
# `ci-conformance-gate-is-single-node-only`.
#
# Parsed by scripts/sensitive-focus-for-diff.sh (the sensitive-e2e-guard detect
# step) with grep/awk, NOT a YAML library -- a CI step must not depend on
# yq/python being installed (a missing dependency would either silently skip the
# gate or hard-fail every run). This means the schema below is a HARD
# REQUIREMENT, not just a style preference:
#
#   - file: <path (or substring of a path), matched against the PR/push
#            changed files>
#     function: <name of the guarded function -- audit trail only, the detector
#                does not parse or match on this field>
#     focus: <sonobuoy --focus regex (ginkgo alternation syntax) that must
#             PASS before a PR touching `file` can merge>
#     specs: <exact number of specs `focus` runs -- asserted against ginkgo's
#             "Ran N of" line so a typo or over-match in `focus` fails loud
#             instead of silently guarding nothing. Declared explicitly (not
#             inferred from `focus`'s alternation count) because one focus
#             alternation may intentionally match several specs.>
#
# To register a newly-discovered recurring-regression function, copy an
# entry below and fill in the four fields -- no code change required.

- file: crates/apiserver/src/handlers/pods.rs
  function: validate_pod_spec_immutable
  focus: "ReplicationController should release no longer matching pods|Job should adopt matching orphans and release non-matching pods"
  specs: 2
