apiVersion: apps/v1
kind: Deployment
metadata:
  name: vap-test-violating
  namespace: integration-vap-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vap-test
  template:
    metadata:
      labels:
        app: vap-test
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
