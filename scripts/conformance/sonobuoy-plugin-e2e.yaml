podSpec:
  containers: []
  nodeSelector:
    kubernetes.io/os: linux
  restartPolicy: Never
  serviceAccountName: sonobuoy-serviceaccount
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  - key: CriticalAddonsOnly
    operator: Exists
  - key: kubernetes.io/e2e-evict-taint-key
    operator: Exists
sonobuoy-config:
  driver: Job
  plugin-name: e2e
  result-format: junit
spec:
  command:
  - /run_e2e.sh
  env:
  - name: E2E_EXTRA_ARGS
    value: --progress-report-url=http://localhost:8099/progress
  - name: E2E_FOCUS
    value: \[Conformance\]
  - name: E2E_PARALLEL
    value: "false"
  - name: E2E_SKIP
    value: \[Disruptive\]|NoExecuteTaintManager
  - name: E2E_USE_GO_RUNNER
    value: "true"
  - name: RESULTS_DIR
    value: /tmp/sonobuoy/results
  - name: SONOBUOY
    value: "true"
  - name: SONOBUOY_CONFIG_DIR
    value: /tmp/sonobuoy/config
  - name: SONOBUOY_K8S_VERSION
    value: v1.36.0
  - name: SONOBUOY_PROGRESS_PORT
    value: "8099"
  - name: SONOBUOY_RESULTS_DIR
    value: /tmp/sonobuoy/results
  image: registry.k8s.io/conformance:v1.36.0
  imagePullPolicy: IfNotPresent
  name: e2e
  resources:
    # Requests only, no limits: small enough to not reserve heavily; large
    # enough to promote the pod to Burstable QoS and escape first-in-line
    # eviction. A limit here would cap the workload's legitimate memory
    # growth (observed up to ~4.29 GiB) and just convert one OOM class into
    # another.
    requests:
      cpu: 100m
      memory: 256Mi
  volumeMounts:
  - mountPath: /tmp/sonobuoy/results
    name: results
