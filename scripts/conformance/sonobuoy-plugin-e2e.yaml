podSpec:
  containers: []
  nodeSelector:
    kubernetes.io/os: linux
  # system-cluster-critical is one of the two built-in PriorityClasses u7s
  # resolves without needing a seeded PriorityClass object (see apiserver
  # lib.rs's PriorityClass admission special-case) -- it keeps this pod out
  # of the kubelet's own soft-eviction ranking during the same memory
  # pressure that triggers the NotReady flap below.
  priorityClassName: system-cluster-critical
  restartPolicy: Never
  serviceAccountName: sonobuoy-serviceaccount
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  - key: CriticalAddonsOnly
    operator: Exists
  - key: kubernetes.io/e2e-evict-taint-key
    operator: Exists
  # mayor-vmye0: a memory-pressure spike under real full-suite churn can gap
  # kubelet's NodeLease heartbeat past node-controller's node-monitor-grace-
  # period (observed 87.1s gap vs. the 40s default), tripping the
  # node.kubernetes.io/not-ready:NoExecute taint. Without this toleration,
  # node-controller's TaintManager evicts this pod (the e2e-job pod itself)
  # on a BRIEF flap, silently losing the whole run's results. 120s is longer
  # than the observed flap but still bounded -- a genuinely dead node still
  # gets its pod evicted and rescheduled, just not one that recovers in time.
  # See ai/findings/mayor-jhtxe-clusterip-latency-2026-08-18.md for the full
  # DELETE/eviction timeline.
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 120
sonobuoy-config:
  driver: Job
  plugin-name: e2e
  result-format: junit
spec:
  command:
  - /run_e2e.sh
  env:
  - name: E2E_EXTRA_ARGS
    value: --progress-report-url=http://localhost:8099/progress
  - name: E2E_FOCUS
    value: \[Conformance\]
  - name: E2E_PARALLEL
    value: "false"
  - name: E2E_SKIP
    value: \[Disruptive\]|NoExecuteTaintManager
  - name: E2E_USE_GO_RUNNER
    value: "true"
  - name: RESULTS_DIR
    value: /tmp/sonobuoy/results
  - name: SONOBUOY
    value: "true"
  - name: SONOBUOY_CONFIG_DIR
    value: /tmp/sonobuoy/config
  - name: SONOBUOY_K8S_VERSION
    value: v1.34.9
  - name: SONOBUOY_PROGRESS_PORT
    value: "8099"
  - name: SONOBUOY_RESULTS_DIR
    value: /tmp/sonobuoy/results
  image: registry.k8s.io/conformance:v1.34.9
  imagePullPolicy: IfNotPresent
  name: e2e
  resources:
    # Requests only, no limits: small enough to not reserve heavily; large
    # enough to promote the pod to Burstable QoS and escape first-in-line
    # eviction. A limit here would cap the workload's legitimate memory
    # growth (observed up to ~4.29 GiB) and just convert one OOM class into
    # another.
    requests:
      cpu: 100m
      memory: 256Mi
  volumeMounts:
  - mountPath: /tmp/sonobuoy/results
    name: results
