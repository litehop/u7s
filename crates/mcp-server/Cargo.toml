[package]
name = "u7s-mcp-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "u7s_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "u7s-mcp-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
