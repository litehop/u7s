[package]
name    = "u7s-scheduler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "u7s-scheduler"
path = "src/main.rs"

[dependencies]
tokio           = { version = "1", features = ["full"] }
hyper           = { version = "1", features = ["http1", "client"] }
hyper-util      = "0.1"
rustls          = "0.23"
rustls-pemfile  = "2"
tokio-rustls    = "0.26"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
clap            = { version = "4", features = ["derive"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow          = "1"
base64          = "0.22"
bytes           = "1"
http-body-util  = "0.1"
