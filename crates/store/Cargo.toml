[package]
name    = "u7s-store"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite        = { version = "0.40", features = ["bundled"] }
tokio           = { version = "1", features = ["full"] }
bytes           = "1"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
thiserror       = "2"
tracing         = "0.1"
async-stream    = "0.3"
futures-core    = "0.3"
