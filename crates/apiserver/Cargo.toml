[package]
name    = "u7s-apiserver"
version = "0.1.0"
edition = "2021"

[lib]
name    = "u7s_apiserver"
path    = "src/lib.rs"
doctest = false

[[bin]]
name = "u7s-apiserver"
path = "src/main.rs"

[dependencies]
u7s-store       = { path = "../store" }
axum            = { version = "0.8", features = ["ws"] }
tower           = "0.5"
tower-service   = "0.3"
hyper           = { version = "1", features = ["http1"] }
hyper-util      = "0.1"
http-body-util  = "0.1"
tokio           = { version = "1", features = ["full"] }
rustls                = "0.23"
rustls-post-quantum   = "0.2"
tokio-rustls    = "0.26"
rcgen           = "0.14"
rustls-pemfile  = "2"
schemars        = { version = "1.0", features = ["derive"] }
serde           = { version = "1", features = ["derive", "rc"] }
serde_json      = "1"
bytes           = "1"
thiserror       = "2"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64          = "0.23"
clap            = { version = "4", features = ["derive"] }
anyhow          = "1"
async-stream    = "0.3"
futures-core    = "0.3"
futures-util    = "0.3"
jsonwebtoken    = { version = "11", features = ["rust_crypto"] }
rsa             = "0.9"
x509-cert = { version = "0.3", features = ["pem"] }
uuid        = { version = "1", features = ["v4"] }
subtle      = "2"
reqwest     = { version = "0.13", features = ["stream", "rustls"], default-features = false }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
boon            = "0.6"
yaml-rust2      = "0.11"
prost           = "0.14"
hmac            = "0.13"
sha2            = "0.11"
u7s-sentinel    = { path = "../sentinel" }
prometheus      = { version = "0.14", default-features = false }

[build-dependencies]
prost-build              = "0.14"
protoc-bin-vendored      = "3.2"

[dev-dependencies]
criterion       = "0.8"

[[bench]]
name    = "list_filter"
harness = false

[[bench]]
name    = "watch_fanout"
harness = false

[[bench]]
name    = "admission_review"
harness = false

[[bench]]
name    = "cr_conversion_fanout"
harness = false
