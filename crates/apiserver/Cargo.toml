[package]
name    = "u7s-apiserver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "u7s-apiserver"
path = "src/main.rs"

[dependencies]
u7s-store       = { path = "../store" }
axum            = { version = "0.8", features = ["ws"] }
tower           = "0.5"
tower-service   = "0.3"
hyper           = { version = "1", features = ["http1"] }
hyper-util      = "0.1"
tokio           = { version = "1", features = ["full"] }
rustls          = "0.23"
tokio-rustls    = "0.26"
rcgen           = "0.14"
rustls-pemfile  = "2"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
bytes           = "1"
thiserror       = "2"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64          = "0.22"
clap            = { version = "4", features = ["derive"] }
anyhow          = "1"
async-stream    = "0.3"
futures-core    = "0.3"
futures-util    = "0.3"
jsonwebtoken    = { version = "10", features = ["rust_crypto"] }
rsa             = "0.9"
x509-cert = "0.2"
uuid        = { version = "1", features = ["v4"] }
subtle      = "2"
reqwest     = { version = "0.13", features = ["stream", "rustls"], default-features = false }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
