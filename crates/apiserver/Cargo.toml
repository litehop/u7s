[package]
name    = "u7s-apiserver"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name    = "u7s_apiserver"
path    = "src/lib.rs"
doctest = false

[[bin]]
name = "u7s-apiserver"
path = "src/main.rs"

[dependencies]
u7s-store       = { path = "../store" }
u7s-scheduler   = { path = "../scheduler" }
axum            = { version = "0.8", features = ["ws"] }
tower           = "0.5"
tower-service   = "0.3"
hyper           = { version = "1", features = ["http1", "http2"] }
hyper-util      = { version = "0.1", features = ["server-auto"] }
http-body-util  = "0.1"
tokio           = { version = "1", features = ["full"] }
rustls                = "0.23"
rustls-post-quantum   = "0.2"
tokio-rustls    = "0.26"
rcgen           = "0.14"
time            = "0.3"
schemars        = { version = "1.0", features = ["derive"] }
serde           = { version = "1", features = ["derive", "rc"] }
serde_json      = "1"
serde_urlencoded = "0.7"
bytes           = "1"
thiserror       = "2"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64          = "0.23"
clap            = { version = "4", features = ["derive"] }
anyhow          = "1"
async-stream    = "0.3"
futures-core    = "0.3"
futures-util    = "0.3"
jsonwebtoken    = { version = "11", features = ["aws_lc_rs"] }
aws-lc-rs       = { version = "1", default-features = false, features = ["aws-lc-sys"] }
x509-cert = { version = "0.3", features = ["pem"] }
uuid        = { version = "1", features = ["v4"] }
subtle      = "2"
reqwest     = { version = "0.13", features = ["stream", "rustls"], default-features = false }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
boon            = "0.6"
cel             = { version = "0.15", default-features = false, features = ["json", "chrono", "ext_encoders"] }
yaml-rust2      = "0.13"
prost           = "0.14"
hmac            = "0.13"
sha2            = "0.11"
u7s-sentinel    = { path = "../sentinel" }
u7s-version     = { path = "../version" }
u7s-proto-generated = { path = "../proto-generated" }
prometheus      = { version = "0.14", default-features = false, features = ["process"] }
chrono-tz       = "0.10"
chrono          = { version = "0.4", default-features = false, features = ["alloc"] }
regex           = "1"
regex-automata  = { version = "0.4", default-features = false, features = ["meta", "syntax", "perf", "unicode"] }
dhat            = { version = "0.3", optional = true }
rlimit          = "0.11"
socket2         = "0.6"
libc            = "0.2"

[features]
dhat = ["dep:dhat"]
pki-test-knobs = []

[build-dependencies]
u7s-proto-generated      = { path = "../proto-generated" }
prost                    = "0.14"
prost-types              = "0.14"
heck                     = "0.5"

[dev-dependencies]
criterion       = "0.8"
prost-types     = "0.14"
tokio           = { version = "1", features = ["test-util"] }

[[bench]]
name    = "list_filter"
harness = false

[[bench]]
name    = "watch_fanout"
harness = false

[[bench]]
name    = "admission_review"
harness = false

[[bench]]
name    = "cr_conversion_fanout"
harness = false

[[bench]]
name    = "request_total_record"
harness = false
