[package]
name    = "u7s-migrate"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name    = "u7s_migrate"
path    = "src/lib.rs"
doctest = false

[[bin]]
name = "u7s"
path = "src/main.rs"

[dependencies]
u7s-apiserver = { path = "../apiserver" }
u7s-version   = { path = "../version" }
politeia      = { git = "https://github.com/litehop/politeia", tag = "v0.3.2" }
tokio         = { version = "1", features = ["full"] }
hyper         = { version = "1", features = ["http1", "client"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
clap          = { version = "4", features = ["derive"] }
anyhow        = "1"

[dev-dependencies]
rcgen         = "0.14"
