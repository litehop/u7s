[package]
name    = "u7s-kcm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name    = "u7s_kcm"
path    = "src/lib.rs"
doctest = false

[dependencies]
politeia   = { git = "https://github.com/litehop/politeia", tag = "v0.3.2" }
tokio      = { version = "1", features = ["full"] }
hyper      = { version = "1", features = ["http1", "client"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tracing    = "0.1"
