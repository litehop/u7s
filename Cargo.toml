[workspace]
members = ["crates/store", "crates/apiserver", "crates/scheduler", "crates/kubeconfig", "crates/sentinel", "crates/sentinel-derive", "crates/proto-generated", "crates/junit-reuse-check"]
# crates/servicelb is its own nested workspace (userspace loader + a no_std
# servicelb-ebpf program crate targeting bpfel-unknown-none via nightly +
# bpf-linker). The loader links Linux-only syscalls (bpf(2), netlink) and
# cannot compile on this workspace's host platforms, so it stays out of the
# default build/test/clippy gates; see crates/servicelb/README.md.
exclude = ["crates/servicelb"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.dist]
inherits = "release"

[profile.dist.package.u7s-proto-generated]
opt-level = "s"
