# WordPress + nginx + php-fpm (valerauko/pehelypress chart v1.2.1, hand-rendered) --
# recovered verbatim from the lima-workload Lima VM's live cluster via
# `kubectl get secret/cm/deploy/svc -o yaml`, sanitized as in mariadb.yaml.
# The pehelypress-database Secret's credentials must match
# mariadb.yaml's Secret exactly (MARIADB_USER=valerauko, MARIADB_DATABASE=valenet,
# MARIADB_PASSWORD=userpw-phase3) and HOSTNAME must resolve via Service DNS, so this
# workload assumes mariadb.yaml is applied into the same "default" namespace.
apiVersion: v1
kind: Secret
metadata:
  name: pehelypress-database
  namespace: default
  labels:
    app.kubernetes.io/instance: pehelypress
    app.kubernetes.io/name: pehelypress
type: Opaque
stringData:
  HOSTNAME: mariadb.default.svc.cluster.local
  DATABASE: valenet
  USERNAME: valerauko
  PASSWORD: userpw-phase3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pehelypress-nginx-config
  namespace: default
  labels:
    app.kubernetes.io/instance: pehelypress
    app.kubernetes.io/name: pehelypress
data:
  nginx.conf: |
    events {
    }
    http {
      include /etc/nginx/mime.types;

      server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Set nginx to serve files from the shared volume!
        root /var/www/html;
        server_name _;

        index index.php;

        client_max_body_size 20M;

        gzip on;

        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt  { log_not_found off; access_log off; }

        location / {
          try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.(js|css|png|jpg|jpeg|gif)$ {
          try_files $uri =404;
          log_not_found off;
        }

        location ~ \.php$ {
          include fastcgi_params;
          fastcgi_index index.php;
          fastcgi_param REQUEST_METHOD $request_method;
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          fastcgi_pass 127.0.0.1:9000;
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pehelypress-php-config
  namespace: default
  labels:
    app.kubernetes.io/instance: pehelypress
    app.kubernetes.io/name: pehelypress
data:
  pehely.ini: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pehelypress
  namespace: default
  labels:
    app.kubernetes.io/instance: pehelypress
    app.kubernetes.io/name: pehelypress
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: pehelypress
      app.kubernetes.io/name: pehelypress
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pehelypress
        app.kubernetes.io/name: pehelypress
    spec:
      hostAliases:
        - ip: 127.0.0.1
          hostnames: ["status.localhost"]
      containers:
        - name: pehelypress-nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
              subPath: wordpress
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          # Deviation from the upstream chart default: the chart's readinessProbe
          # sets an `X-Forwarded-Proto: https` header, which makes WordPress's
          # is_ssl() redirect /wp-login.php to an https:// URL. With no
          # TLS-terminating ingress in front of this bare pod, nginx can never
          # serve that scheme and the probe fails forever regardless of DB state.
          # Header dropped so the redirect resolves on the real http scheme
          # nginx actually serves.
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
        - name: pehelypress
          image: wordpress:6.7.0-php8.3-fpm-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: fpm
              containerPort: 9000
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: pehelypress-database
                  key: HOSTNAME
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pehelypress-database
                  key: DATABASE
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: pehelypress-database
                  key: USERNAME
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pehelypress-database
                  key: PASSWORD
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
              subPath: wordpress
            - name: php-config-volume
              mountPath: /usr/local/etc/php/conf.d/pehely.ini
              subPath: pehely.ini
      volumes:
        - name: php-config-volume
          configMap:
            name: pehelypress-php-config
        - name: nginx-config-volume
          configMap:
            name: pehelypress-nginx-config
        - name: wordpress-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pehelypress
  namespace: default
  labels:
    app.kubernetes.io/instance: pehelypress
    app.kubernetes.io/name: pehelypress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: pehelypress
    app.kubernetes.io/name: pehelypress
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
