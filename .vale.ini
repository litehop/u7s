# Advisory prose lint. Run scripts/vale-report.sh. Rules live in .vale/README.md.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = u7s

Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip, \
           https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, Google, ai-tells, u7s

# Disabled: contradicts the corpus's established conventions (CLAUDE.md,
# docs/style-guide.md rule 11, house voice) or is noise on technical prose.
Google.Contractions = NO    # house voice writes "does not"
Google.EmDash = NO          # corpus and CLAUDE.md use spaced em dashes
ai-tells.EmDashUsage = NO
Google.Semicolons = NO
ai-tells.SemicolonUsage = NO
Google.Colons = NO          # corpus capitalisation after colon is mixed, no house rule
ai-tells.ColonUsage = NO
Google.Parens = NO
Google.Acronyms = NO        # MTU/NIC/VPS are audience-known
Google.Passive = NO         # style-guide rule 2 prefers active but rule 11 says judgment, not lint
Google.WordListCase = NO
Google.WordList = NO        # replaces "CLI" etc., which the style guide itself uses
Google.Latin = NO           # "e.g." is used throughout CLAUDE.md and docs
Google.Units = NO           # "15s", "1GB" are Kubernetes/CLI literals
Google.Quotes = NO          # punctuation-inside-quotes corrupts CLI literals
Google.Ellipses = NO
Google.AMPM = NO
Google.LyHyphens = NO
Google.Headings = NO        # heading case is mixed; no house rule
Google.FirstPerson = NO     # the method-overview doc narrates in first person
Google.We = NO              # ADRs record project decisions as "we"
ai-tells.NounString = NO    # fires on possessives
ai-tells.NegatedObject = NO
ai-tells.FigurativeMints = NO     # "mint" is literal for tokens/certs
ai-tells.FigurativeNouns = NO     # "API surface" is project vocabulary
ai-tells.FigurativeShape = NO     # "shape" is project vocabulary
ai-tells.ShipOveruse = NO         # "ship" is literal for release artefacts
ai-tells.VerbTricolon = NO        # step lists are what style-guide rule 7 asks for
ai-tells.FormalRegister = NO      # "implement" is plain in software docs
ai-tells.FormalTransitions = NO   # "for example" is plain
ai-tells.FillerIntensifier = NO   # "a single" is a numeric claim here

# ADRs record consequences; style-guide rule 3 reserves "will" for them.
[docs/decisions/*.md]
Google.Will = NO

# The style guide quotes the words it bans.
[docs/style-guide.md]
u7s.Minimizing = NO
Google.Will = NO

[crates/**/*.rs]
BasedOnStyles = u7s-code
