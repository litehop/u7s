# MariaDB StatefulSet (Bitnami-chart-derived) backing the WordPress E2E workload in
# wordpress.yaml. Recovered verbatim from the lima-workload Lima VM's live cluster
# via `kubectl get sa/secret/cm/sts/svc -o yaml`, then sanitized of cluster-assigned
# fields (status, uid, resourceVersion, generation, creationTimestamp, managedFields,
# clusterIP). Requires the csi-hostpath-sc StorageClass (csi-hostpath-storageclass.yaml
# + README.md) to exist first.
#
# Secret uses `stringData:` (plaintext at rest) -- this is a disposable E2E fixture,
# not a real deployment; do not reuse these credentials for anything else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mariadb
  namespace: default
  labels:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: mariadb
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/version: "11.8.6"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb
  namespace: default
type: Opaque
stringData:
  mariadb-root-password: rootpw-phase3
  mariadb-password: userpw-phase3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb
  namespace: default
data:
  # Referenced by the StatefulSet's "config" volume below but not mounted by any
  # container -- kept so the volume reference resolves; upstream chart artifact.
  placeholder: "unmounted; referenced by the StatefulSet's config volume but no container mounts it upstream"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: default
  labels:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: mariadb
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/version: "11.8.6"
spec:
  serviceName: mariadb
  replicas: 1
  revisionHistoryLimit: 3
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/component: primary
      app.kubernetes.io/instance: mariadb
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/component: primary
        app.kubernetes.io/instance: mariadb
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/version: "11.8.6"
    spec:
      serviceAccountName: mariadb
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: Always
      terminationGracePeriodSeconds: 30
      containers:
        - name: mariadb
          image: docker.io/mariadb:11.8.6-noble
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: mariadb-root-password
            - name: MARIADB_USER
              value: valerauko
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: mariadb-password
            - name: MARIADB_DATABASE
              value: valenet
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 375m
              memory: 384Mi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          readinessProbe:
            exec:
              command: ["/bin/bash", "-ec", "mariadb-admin ping -uroot -p\"${MARIADB_ROOT_PASSWORD:-}\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "-ec", "mariadb-admin status -uroot -p\"${MARIADB_ROOT_PASSWORD:-}\""]
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: temp
              mountPath: /tmp
            - name: mysqld
              mountPath: /run/mysqld
      volumes:
        - name: config
          configMap:
            name: mariadb
            defaultMode: 420
        - name: temp
          emptyDir: {}
        - name: mysqld
          emptyDir: {}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          app.kubernetes.io/component: primary
          app.kubernetes.io/instance: mariadb
          app.kubernetes.io/name: mariadb
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        storageClassName: csi-hostpath-sc
        resources:
          requests:
            storage: 10Gi
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: default
  labels:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: mariadb
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/version: "11.8.6"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: mariadb
    app.kubernetes.io/name: mariadb
  ports:
    - name: mysql
      port: 3306
      protocol: TCP
      targetPort: mysql
