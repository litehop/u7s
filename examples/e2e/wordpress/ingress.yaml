# Routes http://wordpress.u7s.test/ to the pehelypress Service through the Traefik
# example (examples/e2e/traefik/). The host is not in DNS: send it as a Host header.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pehelypress
  namespace: default
  labels:
    app.kubernetes.io/instance: pehelypress
    app.kubernetes.io/name: pehelypress
spec:
  ingressClassName: traefik
  rules:
    - host: wordpress.u7s.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pehelypress
                port:
                  name: http
