apiVersion: v1
kind: ConfigMap
metadata:
  name: get-u7s-nginx-conf
  labels:
    app: get-u7s
data:
  default.conf: |
    recursive_error_pages on;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        proxy_intercept_errors on;
        # without a matching error_page, proxy_intercept_errors is a no-op --
        # upstream 404s reach the client with GitHub's Set-Cookie / CSP /
        # x-github-* headers passed through, which reads as "hosted by GitHub"
        error_page 404 = @not_found;

        proxy_ssl_server_name on;
        
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;

        # nginx's variable-based proxy_pass (@follow_hop*) skips /etc/resolv.conf
        # entirely and requires its own resolver -- CoreDNS on the pod's
        # ClusterIP nameserver is unreachable to it. Public resolver because
        # we only ever look up external GitHub asset CDN names from here.
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

        # github.com's redirect responses carry several KB of
        # Content-Security-Policy + Set-Cookie headers -- nginx's small
        # default buffers overflow on them ("upstream sent too big header")
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        location = /healthz {
            return 200 "ok\n";
        }
        
        # Stable. The install script is a release ASSET, not a repo file, so
        # it arrives from the same immutable release as the tarball it goes
        # on to install and the two can never skew
        location = /install.sh {
            error_page 301 302 303 307 308 = @follow_hop1;
            # nginx location error_page REPLACES the server-level set --
            # inheritance is all-or-nothing, so we re-declare 404 -> @not_found
            # here and in every sibling location with its own error_page
            error_page 404 = @not_found;
            proxy_pass https://github.com/litehop/u7s/releases/latest/download/install.sh;
        }

        # Pinned. The caller names the release tag, which is the only way to
        # reach a pre-release build. install.sh re-enters here to fetch its
        # own tarball, so this single route serves both the script and the
        # binaries.
        location ~ ^/(v[0-9][A-Za-z0-9.+-]*)/([A-Za-z0-9][A-Za-z0-9._+-]*)$ {
            rewrite ^/([^/]+)/([^/]+)$ /litehop/u7s/releases/download/$1/$2 break;
            error_page 301 302 303 307 308 = @follow_hop1;
            error_page 404 = @not_found;
            proxy_pass https://github.com;
        }

        # Follow Github redirects to up to three hops
        # latest/download -> download/<tag> -> signed raw URL + 1 safety
        location @follow_hop1 {
            internal;
            set $loc1 $upstream_http_location;
            error_page 301 302 303 307 308 = @follow_hop2;
            error_page 404 = @not_found;
            proxy_pass $loc1;
        }

        location @follow_hop2 {
            internal;
            set $loc2 $upstream_http_location;
            error_page 301 302 303 307 308 = @follow_hop3;
            error_page 404 = @not_found;
            proxy_pass $loc2;
        }

        location @follow_hop3 {
            internal;
            set $loc3 $upstream_http_location;
            proxy_pass $loc3;
        }

        location @not_found {
            internal;
            default_type text/plain;
            return 404 "404 Not Found\n";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-u7s
  labels:
    app: get-u7s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: get-u7s
  template:
    metadata:
      labels:
        app: get-u7s
    spec:
      containers:
        - name: nginx
          image: "nginxinc/nginx-unprivileged:1.31-alpine@sha256:c3fed6436b61d2bf2201ec032c35c000871f7ed062dea5d586bc6bf4d0fdd140"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-conf
          configMap:
            name: get-u7s-nginx-conf
        # nginx needs a writable /tmp (proxy_temp etc.) even though the rest
        # of the root filesystem is read-only
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: get-u7s
  labels:
    app: get-u7s
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    app: get-u7s
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: get-u7s
  labels:
    app: get-u7s
spec:
  tls:
    - hosts:
        - u7s.dekiru.tech
      secretName: dekiru-tech-tls
  rules:
    - host: u7s.dekiru.tech
      http:
        paths:
          - backend:
              service:
                name: get-u7s
                port:
                  name: http
            path: /
            pathType: Prefix
            
