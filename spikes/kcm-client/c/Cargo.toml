[package]
name = "spike-c"
version = "0.0.0"
edition = "2021"

[dependencies]
spike-common = { path = "../common" }
politeia = { git = "https://github.com/litehop/politeia", tag = "v0.3.2" }
hyper = { version = "1", features = ["http1", "client"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
