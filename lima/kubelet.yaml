# Lima VM for local kubelet join testing against u7s running on the Mac host.
#
# Prerequisites:
#   brew install lima
#   u7s must be running on the host (scripts/lima-start.sh handles this check)
#
# Usage:
#   scripts/lima-start.sh

vmType: vz
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

cpus: 8
# 4GiB was the original default but proved too small for real conformance load:
# kubelet+CRI-O+CoreDNS+metrics-server+kube-proxy plus ~15-20+ concurrent e2e
# test pods plus the sonobuoy aggregator/e2e-job pods repeatedly drove the
# kernel OOM-killer to kill sonobuoy/agnhost/coredns (--focus
# 'Simple'; sig-network Services family at --procs=16, memory
# usage measured at 3663/3894MB used with a real OOM-kill logged in kubelet's
# own oom_watcher). A curated 15-spec csi-hostpath focus even OOM'd within 6s
# at 4GiB, and the sonobuoy aggregator itself still OOM'd at
# 4GiB during a full-suite run, which needed a manual bump to
# 6GiB to complete — 8GiB below adds documented margin beyond that observed
# floor (session findings archived 2026-08-18 under ai/findings/).
memory: 8GiB
# 20GiB was the original disk default. lima-start.sh's own journald-retention
# comment already documented the margin as tight ("~14G free observed with
# only base images pulled"), and a 2026-08-18 --all-e2e DiskPressure audit
# (session findings archived under ai/findings/) observed a 237-pod/108s
# ReplicaSet-replacement storm during a transient DiskPressure condition
# under concurrent-namespace image pulls at --procs=16 -- real, correct
# kube-controller-manager behavior, but the exact trigger (oscillation vs.
# sustained-true DiskPressure) was left an open question by that audit's own
# findings (the original run's raw logs are gone). Doubling the ceiling is a
# cheap, plausible mitigation for a disk-headroom-related trigger, NOT a
# confirmed fix against that exact mechanism: a separate, deliberate live
# repro confirmed sustained-true DiskPressure behavior in general, and a
# csi-hostpath focus run showed flat/healthy disk usage under this ceiling,
# but a full --all-e2e before/after was declined as disproportionate for
# this rare discovery-only run (a follow-on tracks revisiting this if a
# routinely-run e2e subset ever hits similar behavior). This is a vz sparse
# disk image (host usage tracks actual bytes written, confirmed via `du`
# showing ~5.5GiB actual for a 20GiB nominal file already at 29% used), so
# doubling the ceiling costs no real host disk until a run actually needs it.
disk: 40GiB

# Shared unprivileged switch so multiple VMs can reach each other directly (needed
# for cross-node pod routing — see scripts/conformance/lima-start.sh). Unlike
# shared/bridged/host, user-v2 needs no socket_vmnet/sudoers host setup.
networks:
  - lima: user-v2

images:
  - location: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
    arch: x86_64
  - location: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64

portForwards:
  # Expose the kubelet API to the Mac host so the apiserver can proxy log/exec/attach.
  # Without this, the kubelet's InternalIP (192.168.5.x) is not routable from the host.
  - guestPort: 10250
    hostPort: 10250

mounts:
  - location: "~"
    writable: false
  - location: "/tmp/lima"
    writable: true

# u7s uses cri-o exclusively. Lima's builtin default enables a per-USER
# (rootless) containerd + its nerdctl-full bundle (buildkitd,
# containerd-stargz-grpc, rootlesskit, slirp4netns) unconditionally on
# x86_64/aarch64 — ~142 MB/VM of RSS never touched by anything in our
# provision script below. Setting both keys false stops Lima from even
# installing that stack, independent of (and in addition to) the
# provision script's own `systemctl disable/mask` of the separate
# system-wide containerd.service unit further down.
containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail

      # First-boot race: cloud-init always waits for network
      # here because Lima's generated cloud-config includes a `mounts:` key
      # (cloud-init treats ANY mounts as potentially network-based). That
      # wait invokes systemd-networkd-wait-online, which can lose a race
      # against cloud-init's own MAC-matched interface rename (enp0s1 ->
      # eth0): "[busy] Error renaming mac=... from enp0s1 to eth0". The
      # network interface itself is already up (DHCP succeeded under
      # whichever name won the race) but DNS (resolvectl) only finishes
      # wiring up a few seconds after this script starts running on a fresh
      # VM, so an immediate `apt-get update`/`curl` below can fail with
      # unresolvable-host errors and abort the whole script (set -e), which
      # is what silently skipped the image pre-pull and sonobuoy install on
      # first boot. Wait for DNS to actually resolve before touching it.
      for _ in $(seq 1 60); do
        getent hosts archive.ubuntu.com >/dev/null 2>&1 && break
        sleep 2
      done
      getent hosts archive.ubuntu.com >/dev/null 2>&1 || {
        echo "DNS never became available after 120s — aborting provisioning" >&2
        exit 1
      }

      apt-get update -qq
      apt-get install -y apt-transport-https ca-certificates curl gpg

      # Install cri-o 1.36 and crun
      curl -fsSL https://slc-mirror.opensuse.org/repositories/isv:/cri-o:/stable:/v1.36/deb/Release.key \
        | gpg --batch --yes --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg
      echo 'deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://slc-mirror.opensuse.org/repositories/isv:/cri-o:/stable:/v1.36/deb/ /' \
        > /etc/apt/sources.list.d/cri-o.list
      apt-get update -qq
      apt-get install -y cri-o crun conmon
      # Do NOT add a 10-crun.conf drop-in pointing at /usr/bin/crun.
      # CRI-O ships its own crun at /usr/libexec/crio/crun that matches the OCI
      # spec version it generates (1.2.x). The system crun only accepts 1.0/1.1
      # and will fail with "unknown version specified" on every sandbox create.
      # The 10-crio.conf shipped by the cri-o package already sets the correct path.
      mkdir -p /etc/crio/crio.conf.d

      # Alias a "test-handler" runtime to the same cri-o-bundled runc used by the
      # package's own "runc" entry above. Upstream's RuntimeClass e2e suite
      # (test/e2e/framework/node/runtimeclass) hardcodes "test-handler" as the
      # handler name and expects it preconfigured in the container runtime —
      # this is the same block cri-o's own upstream CI adds for that suite
      # (cri-o/cri-o contrib/test/ci/e2e-base.yml), just pointed at the
      # crio-bundled runc path instead of a system /usr/bin/runc (which isn't
      # installed on this image; see the crun path caution above).
      printf '[crio.runtime.runtimes.test-handler]\nruntime_path = "/usr/libexec/crio/runc"\nruntime_type = "oci"\nruntime_root = "/run/runc"\nmonitor_path = "/usr/libexec/crio/conmon"\n' > /etc/crio/crio.conf.d/20-test-handler.conf

      # Enable the CNI 1.0.0 conflist bridge config.
      # The cri-o package ships two CNI configs:
      #   10-crio-bridge.conf         — old 0.4.0 single-plugin format (fails with crun 1.26+)
      #   10-crio-bridge.conflist     — new 1.0.0 conflist format (correct)
      # Disable the old one and enable the new one.
      CNI_DIR=/etc/cni/net.d
      if [ -f "$CNI_DIR/10-crio-bridge.conf" ]; then
        mv "$CNI_DIR/10-crio-bridge.conf" "$CNI_DIR/10-crio-bridge.conf.disabled" || true
      fi
      if [ -f "$CNI_DIR/10-crio-bridge.conflist.disabled" ]; then
        mv "$CNI_DIR/10-crio-bridge.conflist.disabled" "$CNI_DIR/10-crio-bridge.conflist" || true
      fi
      # If conflist already exists and is correct, nothing to do.

      systemctl enable --now crio

      # Disable containerd — u7s uses cri-o exclusively; containerd on the same host
      # risks cgroup/network/image-lock contention and wastes ~78 MB RSS per VM.
      systemctl disable --now containerd containerd.service 2>/dev/null || true
      systemctl mask containerd 2>/dev/null || true

      # Install kubelet 1.36 from pkgs.k8s.io
      curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key \
        | gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /' \
        > /etc/apt/sources.list.d/kubernetes.list
      apt-get update -qq
      apt-get install -y kubelet
      apt-mark hold kubelet

      # Install crictl — CLI for the CRI runtime; lets workers inspect containers when debugging.
      # Detect VM arch: aarch64 → arm64, x86_64 → amd64.
      CRICTL_VERSION="v1.36.0"
      case "$(uname -m)" in
        aarch64) CRICTL_ARCH="arm64" ;;
        x86_64)  CRICTL_ARCH="amd64" ;;
        *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
      esac
      if ! crictl --version 2>/dev/null | grep -qF "${CRICTL_VERSION}"; then
        curl -fsSL "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRICTL_VERSION}/crictl-${CRICTL_VERSION}-linux-${CRICTL_ARCH}.tar.gz" \
          | tar -xz -C /usr/local/bin crictl
        chmod +x /usr/local/bin/crictl
      fi
      printf 'runtime-endpoint: unix:///var/run/crio/crio.sock\nimage-endpoint: unix:///var/run/crio/crio.sock\ntimeout: 10\ndebug: false\n' > /etc/crictl.yaml

      # Pre-pull the e2e-test-images/conformance image set at provision time so
      # these specific images never need a runtime network fetch during a real
      # conformance run. A ~92s burst-triggered SYN-drop at the limactl usernet
      # layer once black-holed 10 concurrent image-pull TCP flows mid-run;
      # kubelet's own backoff eventually recovered them, but upstream e2e's
      # pod-watch step fails fast on the first ErrImagePull/ImagePullBackOff
      # event regardless of eventual success. Pulling here, one at a time,
      # during quiet provisioning (not under 16-way conformance load) sidesteps
      # that failure mode entirely for this bounded, known set.
      #
      # List provenance: registry.k8s.io/e2e-test-images/* tags are copied from
      # kubernetes/kubernetes test/utils/image/manifest.go (release-1.36),
      # excluding images that can't or shouldn't be pre-pulled (AgnhostPrivate —
      # requires private-registry auth; InvalidRegistryImage — deliberately
      # unresolvable) and images not exercised by the sonobuoy e2e plugin this
      # project runs (NodePerf*, Perl — test/e2e_node only, not test/e2e;
      # DistrolessIptables, VolumeNFSServer, VolumeISCSIServer — non-conformance
      # network/volume tests). registry.k8s.io/sig-storage/* tags are copied from
      # test/e2e/testing-manifests/storage-csi/hostpath/hostpath/csi-hostpath-plugin.yaml
      # (same branch) — the CSI hostpath driver pod that inline-ephemeral-volume
      # tests deploy, whose sidecar image pulls were found to genuinely never
      # recover within a test's own timeout budget in one audited run.
      # The conformance image tag tracks whatever kubelet version pkgs.k8s.io
      # actually installed above, rather than a second hardcoded version string.
      KUBELET_INSTALLED_VERSION=$(kubelet --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
      for IMG in \
        "registry.k8s.io/conformance:v${KUBELET_INSTALLED_VERSION}" \
        "registry.k8s.io/e2e-test-images/agnhost:2.55" \
        "registry.k8s.io/e2e-test-images/agnhost:2.63.0" \
        "registry.k8s.io/e2e-test-images/apparmor-loader:1.4" \
        "registry.k8s.io/e2e-test-images/busybox:1.37.0-1" \
        "registry.k8s.io/e2e-test-images/glibc-dns-testing:2.0.0" \
        "registry.k8s.io/e2e-test-images/ipc-utils:1.4" \
        "registry.k8s.io/e2e-test-images/kitten:1.8" \
        "registry.k8s.io/e2e-test-images/nautilus:1.8" \
        "registry.k8s.io/e2e-test-images/nginx:1.15-4" \
        "registry.k8s.io/e2e-test-images/nginx:1.27-0" \
        "registry.k8s.io/e2e-test-images/nonewprivs:1.4" \
        "registry.k8s.io/e2e-test-images/nonroot:1.5" \
        "registry.k8s.io/e2e-test-images/regression-issue-74839:1.4" \
        "registry.k8s.io/e2e-test-images/resource-consumer:1.14" \
        "registry.k8s.io/e2e-test-images/sample-apiserver:1.29.2" \
        "registry.k8s.io/sig-storage/hostpathplugin:v1.17.1" \
        "registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.17.0" \
        "registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0" \
        "registry.k8s.io/sig-storage/livenessprobe:v2.18.0" \
        "registry.k8s.io/sig-storage/csi-attacher:v4.11.0" \
        "registry.k8s.io/sig-storage/csi-provisioner:v6.1.1" \
        "registry.k8s.io/sig-storage/csi-resizer:v2.1.0" \
        "registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0" \
        "registry.k8s.io/sig-storage/csi-snapshot-metadata:v0.2.0" \
      ; do
        crictl pull "$IMG"
      done

      # Install sonobuoy — static binary, used for local conformance runs against u7s on host.
      # Detect VM arch: aarch64 → arm64, x86_64 → amd64.
      SONOBUOY_VERSION="0.57.3"
      case "$(uname -m)" in
        aarch64) SONOBUOY_ARCH="arm64" ;;
        x86_64)  SONOBUOY_ARCH="amd64" ;;
        *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://github.com/vmware-tanzu/sonobuoy/releases/download/v${SONOBUOY_VERSION}/sonobuoy_${SONOBUOY_VERSION}_linux_${SONOBUOY_ARCH}.tar.gz" \
        | tar -xz -C /usr/local/bin sonobuoy
      chmod +x /usr/local/bin/sonobuoy

      # Disable kubelet until the kubeconfig is provisioned by scripts/lima-start.sh
      systemctl disable kubelet

      # Create static pod dir
      mkdir -p /tmp/kubelet-pods

      # Write kubelet args — kubeconfig placed at /etc/kubelet-kubeconfig by lima-start.sh
      mkdir -p /etc/systemd/system/kubelet.service.d
      # serializeImagePulls/maxParallelImagePulls: HTTP/2 removed the pod-admission pacing that used to hide
      # the upstream-default single-worker image-pull queue's cost under 16-way conformance load.
      # NOTE: maxParallelImagePulls has no CLI flag equivalent — it must be set here, not via kubelet ExecStart.
      #
      # registryPullQPS: a csi-hostpath --focus run deploys ~15-16 concurrent CSI driver
      # StatefulSets, each with ~8 sidecar containers (csi-attacher/provisioner/resizer/
      # snapshotter/node-driver-registrar/liveness-probe/health-monitor), landing 100+ image
      # pull requests within the same few seconds. That burst blew past the upstream default
      # (registryPullQPS=5, registryBurst=10) — a SEPARATE token-bucket gate from
      # maxParallelImagePulls above: the parallelism semaphore bounds concurrent in-flight
      # pulls, while the QPS limiter independently throttles the *rate* of pull attempts
      # regardless of concurrency — producing 274 "ErrImagePull: pull QPS exceeded" events and
      # 0/324 specs ever starting Setup. `0` is kubelet's own documented off-switch
      # ("If 0, unlimited", per `kubelet --help`'s --registry-qps doc), not a magic number;
      # maxParallelImagePulls: 10 above remains the real concurrency bound.
      #
      # ClusterTrustBundle(Projection): Beta-since-1.33; PodCertificateRequest: Beta-since-1.35
      # but default-OFF (`kubelet --help` lists all three as
      # "BETA - default=false"), so the real kubelet silently skips the
      # `clusterTrustBundle`/`podCertificate` projected-volume sources on a Pod spec
      # without these gates — the mounttest container never sees its expected file and
      # the pod hangs waiting for Ready instead of erroring loudly. u7s's
      # apiserver already serves certificates.k8s.io/v1beta1 ClusterTrustBundle +
      # PodCertificateRequest CRUD (PR #1195); these gates are what make the real
      # kubelet actually act on them. ClusterTrustBundle itself (not just its
      # ...Projection variant) also gates kubelet's client-go lister/informer for the
      # resource type, so the projection is inert without it too. PodCertificateRequest
      # still needs a signer to approve/issue (tracked separately) — enabling it here
      # only gets kubelet as far as creating the PodCertificateRequest object, which is
      # real kubelet-side behavior this bead is scoped to.
      printf 'apiVersion: kubelet.config.k8s.io/v1beta1\nkind: KubeletConfiguration\ncontainerRuntimeEndpoint: unix:///var/run/crio/crio.sock\nregisterNode: true\nfailSwapOn: false\nresolvConf: ""\nstaticPodPath: /tmp/kubelet-pods\nclusterDNS:\n  - 10.96.0.10\nclusterDomain: cluster.local\nserializeImagePulls: false\nmaxParallelImagePulls: 10\nregistryPullQPS: 0\nfeatureGates:\n  ClusterTrustBundle: true\n  ClusterTrustBundleProjection: true\n  PodCertificateRequest: true\n' > /etc/kubelet-config.yaml
      printf '[Service]\nExecStart=\nExecStart=/usr/bin/kubelet \\\n  --config=/etc/kubelet-config.yaml \\\n  --kubeconfig=/etc/kubelet-kubeconfig \\\n  --hostname-override=lima-node \\\n  --v=2\n' > /etc/systemd/system/kubelet.service.d/u7s.conf
      systemctl daemon-reload

probes:
  - description: cri-o is running
    script: |
      #!/bin/bash
      systemctl is-active --quiet crio
    hint: "cri-o failed to start — check: limactl shell lima-node sudo journalctl -u crio"
  - description: sonobuoy is installed
    script: |
      #!/bin/bash
      command -v sonobuoy >/dev/null
    hint: "sonobuoy not found — re-provision: limactl delete lima-node && scripts/lima-start.sh"
  - description: crictl is installed
    script: |
      #!/bin/bash
      command -v crictl >/dev/null
    hint: "crictl not found — re-provision: limactl delete lima-node && scripts/lima-start.sh"
