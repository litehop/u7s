name: Performance

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: RSS benchmark
        run: bash scripts/bench-rss.sh

      - name: Upload perf results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-server-log
          path: /tmp/u7s-bench-*/server.log

  bench-rss-load:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: RSS load benchmark
        run: bash scripts/bench-rss-load.sh

      - name: Upload perf results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-load-server-log
          path: /tmp/u7s-bench-load-*/server.log

  bench-rss-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        run: cargo build --release -p u7s-apiserver

      - name: Add ~/bin to PATH
        run: |
          mkdir -p ~/bin
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache kubectl 1.36.2
        id: cache-kubectl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/bin/kubectl
          key: kubectl-1.36.2-${{ runner.arch }}

      - name: Install kubectl 1.36.2
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        env:
          K8S_VERSION: "1.36.2"
        run: |
          MINOR=$(echo "$K8S_VERSION" | cut -d. -f1-2)
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades "kubectl=$K8S_VERSION-*"
          sudo apt-mark hold kubectl
          mkdir -p ~/bin
          cp /usr/bin/kubectl ~/bin/kubectl

      - name: Start apiserver
        env:
          RUST_LOG: info
        run: |
          TMPDIR=$(mktemp -d)
          echo "BENCH_TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          BENCH_TOKEN="bench-admin-token-$(date +%s)"
          echo "$BENCH_TOKEN,bench-admin,uid0,system:masters" > "$TMPDIR/token-auth.csv"
          ./target/release/u7s-apiserver \
            --db "$TMPDIR/state.db" \
            --kubeconfig "$TMPDIR/kubeconfig" \
            --sa-key "$TMPDIR/sa.key" \
            --sa-pub "$TMPDIR/sa.pub" \
            --ca-key "$TMPDIR/ca.key" \
            --ca-cert "$TMPDIR/ca.crt" \
            --token-auth-file "$TMPDIR/token-auth.csv" \
            --advertise-address https://127.0.0.1:6443 \
            --service-cluster-ip-range "10.96.0.0/12" \
            >"$TMPDIR/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 2>/dev/null && break
            sleep 1
          done
          nc -z 127.0.0.1 6443 2>/dev/null || { echo "Server did not start"; cat "$TMPDIR/server.log"; exit 1; }
          # Save cert-based kubeconfig before overwriting with token kubeconfig.
          cp "$TMPDIR/kubeconfig" "$TMPDIR/kubeconfig-cert"
          CA_DATA=$(grep "certificate-authority-data" "$TMPDIR/kubeconfig" | awk '{print $2}')
          echo "BENCH_TOKEN=$BENCH_TOKEN" >> "$GITHUB_ENV"
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    server: https://127.0.0.1:6443' \
            "    certificate-authority-data: $CA_DATA" \
            '  name: u7s' \
            'contexts:' \
            '- context:' \
            '    cluster: u7s' \
            '    user: bench-admin' \
            '  name: u7s' \
            'current-context: u7s' \
            'users:' \
            '- name: bench-admin' \
            '  user:' \
            "    token: $BENCH_TOKEN" \
            > "$TMPDIR/kubeconfig"

      - name: Download kube-controller-manager
        run: |
          TMPDIR="${{ env.BENCH_TMPDIR }}"
          curl -fsSL "https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kube-controller-manager" \
            -o "$TMPDIR/kube-controller-manager"
          chmod +x "$TMPDIR/kube-controller-manager"

      - name: Extract CA cert and start kcm
        run: |
          TMPDIR="${{ env.BENCH_TMPDIR }}"
          grep "certificate-authority-data" "$TMPDIR/kubeconfig-cert" | awk '{print $2}' | base64 -d > "$TMPDIR/ca.pem"
          "$TMPDIR/kube-controller-manager" \
            --kubeconfig="$TMPDIR/kubeconfig-cert" \
            --cluster-signing-cert-file="$TMPDIR/ca.pem" \
            --cluster-signing-key-file="$TMPDIR/ca.key" \
            --service-account-private-key-file="$TMPDIR/sa.key" \
            --root-ca-file="$TMPDIR/ca.pem" \
            --controllers=csrapproving,csrsigning,garbagecollector,deployment,replicaset \
            --use-service-account-credentials=false \
            --leader-elect=false \
            --bind-address=127.0.0.1 \
            --kube-api-content-type=application/json \
            >"$TMPDIR/kcm.log" 2>&1 &
          echo "KCM_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for kcm to be alive
        run: |
          TMPDIR="${{ env.BENCH_TMPDIR }}"
          for i in $(seq 1 30); do
            kill -0 "$KCM_PID" 2>/dev/null && break
            sleep 1
          done
          kill -0 "$KCM_PID" 2>/dev/null || { echo "kcm failed to start"; cat "$TMPDIR/kcm.log"; exit 1; }

      - name: Start u7s-scheduler
        run: |
          TMPDIR="${{ env.BENCH_TMPDIR }}"
          cargo build --release -p u7s-scheduler
          ./target/release/u7s-scheduler \
            --kubeconfig "$TMPDIR/kubeconfig-cert" \
            >"$TMPDIR/scheduler.log" 2>&1 &
          echo "SCHEDULER_PID=$!" >> "$GITHUB_ENV"

      - name: Sample baseline RSS
        run: |
          sleep 5
          SERVER_RSS=$(ps -o rss= -p "$SERVER_PID" | tr -d ' ')
          SCHEDULER_RSS=$(ps -o rss= -p "$SCHEDULER_PID" | tr -d ' ')
          RSS_BASELINE=$(( SERVER_RSS + SCHEDULER_RSS ))
          echo "RSS_BASELINE=$RSS_BASELINE" >> "$GITHUB_ENV"
          echo "Baseline RSS (apiserver): ${SERVER_RSS} kB"
          echo "Baseline RSS (scheduler): ${SCHEDULER_RSS} kB"
          echo "Baseline RSS (combined) : ${RSS_BASELINE} kB"

      - name: Deployment reconciliation workload (50 cycles)
        env:
          KUBECONFIG: ${{ env.BENCH_TMPDIR }}/kubeconfig
        run: |
          TMPDIR="${{ env.BENCH_TMPDIR }}"
          kubectl create namespace default || true
          kubectl create configmap bench-config --from-literal=key=value --namespace default || true
          for i in $(seq 1 50); do
            kubectl create --validate=false -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: bench-deploy-$i
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: bench-$i
            template:
              metadata:
                labels:
                  app: bench-$i
              spec:
                containers:
                  - name: bench
                    image: busybox:1.36
                    command: ["sleep", "3600"]
          EOF
            RS_FOUND=0
            for j in $(seq 1 30); do
              RS_COUNT=$(kubectl get rs -l "app=bench-$i" -n default --no-headers 2>/dev/null | wc -l | tr -d ' ')
              if [ "$RS_COUNT" -ge 1 ]; then
                RS_FOUND=1
                break
              fi
              sleep 1
            done
            if [ "$RS_FOUND" -eq 0 ]; then
              echo "ERROR: No ReplicaSet created for bench-deploy-$i within 30s"
              tail -50 "$TMPDIR/kcm.log"
              tail -50 "$TMPDIR/server.log"
              exit 1
            fi
            kubectl delete deployment "bench-deploy-$i" -n default
          done
          sleep 30

      - name: Sample peak RSS and check threshold
        run: |
          SERVER_RSS=$(ps -o rss= -p "$SERVER_PID" | tr -d ' ')
          SCHEDULER_RSS=$(ps -o rss= -p "$SCHEDULER_PID" | tr -d ' ')
          RSS_PEAK=$(( SERVER_RSS + SCHEDULER_RSS ))
          DELTA=$(( RSS_PEAK - RSS_BASELINE ))
          echo "Baseline RSS (combined): ${RSS_BASELINE} kB"
          echo "Peak RSS (apiserver)   : ${SERVER_RSS} kB"
          echo "Peak RSS (scheduler)   : ${SCHEDULER_RSS} kB"
          echo "Peak RSS (combined)    : ${RSS_PEAK} kB"
          echo "Delta                  : ${DELTA} kB"
          if [ "$DELTA" -gt 10240 ]; then
            echo "FAIL: RSS delta ${DELTA} kB exceeds 10240 kB (10 MB)"
            exit 1
          fi
          echo "PASS: RSS delta ${DELTA} kB is within threshold"

      - name: Stop apiserver and kcm
        if: always()
        run: |
          [ -n "$SCHEDULER_PID" ] && kill "$SCHEDULER_PID" 2>/dev/null || true
          [ -n "$KCM_PID" ] && kill "$KCM_PID" 2>/dev/null || true
          [ -n "$SERVER_PID" ] && kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-rss-deploy-logs
          path: |
            ${{ env.BENCH_TMPDIR }}/server.log
            ${{ env.BENCH_TMPDIR }}/kcm.log
            ${{ env.BENCH_TMPDIR }}/scheduler.log
