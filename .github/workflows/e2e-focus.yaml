name: E2E focus

on:
  push:
    branches:
      - main
  pull_request:
  # Without this, the merge queue's temporary branch never fires this
  # workflow, so its required check can never report and the queue
  # deadlocks waiting forever for a check that will never arrive.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: OS version
        id: os-version
        run: |
          . /etc/os-release
          echo "v=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: rustc version
        id: rustc-version
        run: echo "v=$(rustc -V)" >> "$GITHUB_OUTPUT"
      - name: Restore release binary cache
        id: release-bin-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/u7s-apiserver
            target/release/u7s-scheduler
          key: release-bin-${{ runner.os }}-${{ steps.os-version.outputs.v }}-${{ runner.arch }}-${{ steps.rustc-version.outputs.v }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'crates/**/*.proto') }}
      - name: Build release binaries
        if: steps.release-bin-cache.outputs.cache-hit != 'true'
        run: cargo build --release --timings -p u7s-apiserver -p u7s-scheduler
      # --timings writes target/cargo-timings/cargo-timing.html; upload it even on
      # build failure (a timeout still yields a partial report) but only when the
      # build actually ran -- a cache hit produces no report.
      - name: Upload build timings report
        if: always() && steps.release-bin-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: u7s-e2e-focus-build-timings
          path: target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7
      # actions/cache's combined action saves unconditionally on a cache miss in its
      # Post step, even if the build step failed. Split restore/save lets us gate the
      # save on build success so a partially-failed build is never cached as valid.
      - name: Save release binary cache
        if: steps.release-bin-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/u7s-apiserver
            target/release/u7s-scheduler
          key: release-bin-${{ runner.os }}-${{ steps.os-version.outputs.v }}-${{ runner.arch }}-${{ steps.rustc-version.outputs.v }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'crates/**/*.proto') }}
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: u7s-e2e-focus-binaries
          path: |
            target/release/u7s-apiserver
            target/release/u7s-scheduler
          retention-days: 1

  e2e-focus:
    needs: build
    runs-on: ubuntu-latest
    # Tight while the sonobuoy step below is unproven -- a hang anywhere in
    # this job should fail fast instead of burning 20+ minutes per iteration.
    # Raise once sonobuoy is confirmed reliably completing.
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.11", "1.35.8", "1.36.4"]
    name: e2e-focus ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run baseline e2e-focus
        uses: ./.github/actions/e2e-focus-run
        with:
          k8s_version: ${{ matrix.k8s }}
          focus: "RollingUpdateDeployment should delete old pods and create new ones|Kubectl logs logs should be able to retrieve and filter logs|Job should adopt matching orphans and release non-matching pods|ConfigMap should be consumable in multiple volumes in the same pod"
          expected_specs: "4"
          run_label: e2e-focus
