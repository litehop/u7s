name: E2E focus

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binaries
        run: cargo build --release -p u7s-apiserver -p u7s-scheduler
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: u7s-e2e-focus-binaries
          path: |
            target/release/u7s-apiserver
            target/release/u7s-scheduler
          retention-days: 1

  e2e-focus:
    needs: build
    runs-on: ubuntu-latest
    # Tight while the sonobuoy step below is unproven -- a hang anywhere in
    # this job should fail fast instead of burning 20+ minutes per iteration.
    # Raise once sonobuoy is confirmed reliably completing.
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.9", "1.35.6", "1.36.2"]
    name: e2e-focus ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: u7s-e2e-focus-binaries
          path: target/release
      - name: Make binaries executable
        run: chmod +x target/release/u7s-apiserver target/release/u7s-scheduler

      - name: Add ~/bin to PATH
        run: |
          mkdir -p ~/bin
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache kubelet and kubectl ${{ matrix.k8s }}
        id: cache-kubelet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/bin/kubelet
            ~/bin/kubectl
          key: kubelet-kubectl-${{ matrix.k8s }}-${{ runner.arch }}

      - name: Install kubelet and kubectl ${{ matrix.k8s }}
        if: steps.cache-kubelet.outputs.cache-hit != 'true'
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          MINOR=$(echo "$K8S_VERSION" | cut -d. -f1-2)
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades "kubelet=$K8S_VERSION-*" "kubectl=$K8S_VERSION-*"
          sudo apt-mark hold kubelet kubectl
          sudo systemctl disable --now kubelet
          mkdir -p ~/bin
          cp /usr/bin/kubelet ~/bin/kubelet
          cp /usr/bin/kubectl ~/bin/kubectl

      - name: Cache cri-o apt archives
        id: cache-crio-apt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: crio-apt-${{ matrix.k8s }}-${{ runner.arch }}

      - name: Install cri-o and crun
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          MINOR=$(echo "$K8S_VERSION" | cut -d. -f1-2)
          sudo apt-get update -qq
          sudo apt-get install -y apt-transport-https ca-certificates curl gpg
          curl -fsSL "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/cri-o.list
          sudo apt-get update -qq
          sudo apt-get install -y cri-o
          sudo mkdir -p /etc/cni/net.d
          sudo cp .github/workflows/e2e-focus-resources/cni-bridge.conflist /etc/cni/net.d/10-bridge.conflist
          sudo systemctl enable --now crio

      - name: Install containernetworking-plugins
        run: |
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" containernetworking-plugins

      - name: Cache sonobuoy CLI
        id: cache-sonobuoy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/bin/sonobuoy
          key: sonobuoy-0.57.3-${{ runner.arch }}

      - name: Install sonobuoy CLI
        if: steps.cache-sonobuoy.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bin
          curl -fsSL "https://github.com/vmware-tanzu/sonobuoy/releases/download/v0.57.3/sonobuoy_0.57.3_linux_amd64.tar.gz" \
            | tar -xz -C ~/bin sonobuoy
          chmod +x ~/bin/sonobuoy

      - name: Start apiserver
        env:
          RUST_LOG: info
        run: |
          WORKDIR="$PWD/temp/u7s"
          mkdir -p "$WORKDIR"
          E2E_TOKEN="e2e-focus-admin-token-$(date +%s)"
          echo "$E2E_TOKEN,e2e-focus-admin,uid0,system:masters" > "$WORKDIR/token-auth.csv"
          # No --konnectivity-proxy-addr: apiserver and kubelet are co-located on
          # this same runner, and u7s's pods/log + pods/exec + pods/attach +
          # pods/portforward handlers all dial the kubelet directly via
          # --kubelet-preferred-address regardless of that flag -- konnectivity
          # is only consulted on the pods/proxy and services/proxy paths, which
          # neither of this workflow's two target specs exercises (see
          # crates/apiserver/src/handlers/proxy.rs's resolve_kubelet_address).
          ./target/release/u7s-apiserver \
            --db "$WORKDIR/state.db" \
            --kubeconfig "$WORKDIR/kubeconfig" \
            --sa-key "$WORKDIR/sa.key" \
            --sa-pub "$WORKDIR/sa.pub" \
            --ca-key "$WORKDIR/ca.key" \
            --ca-cert "$WORKDIR/ca.crt" \
            --token-auth-file "$WORKDIR/token-auth.csv" \
            --advertise-address https://127.0.0.1:6443 \
            --service-cluster-ip-range "10.96.0.0/12" \
            --kubelet-preferred-address 127.0.0.1 \
            >"$WORKDIR/apiserver.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 2>/dev/null && break
            sleep 1
          done
          nc -z 127.0.0.1 6443 2>/dev/null || { echo "Server did not start"; cat "$WORKDIR/apiserver.log"; exit 1; }
          # Save the cert-based kubeconfig before overwriting with a token one
          # below -- kube-controller-manager needs the cert-based identity.
          cp "$WORKDIR/kubeconfig" "$WORKDIR/kubeconfig-cert"
          CA_DATA=$(grep "certificate-authority-data" "$WORKDIR/kubeconfig" | awk '{print $2}')
          echo "E2E_TOKEN=$E2E_TOKEN" >> "$GITHUB_ENV"
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    server: https://127.0.0.1:6443' \
            "    certificate-authority-data: $CA_DATA" \
            '  name: u7s' \
            'contexts:' \
            '- context:' \
            '    cluster: u7s' \
            '    user: e2e-focus-admin' \
            '  name: u7s' \
            'current-context: u7s' \
            'users:' \
            '- name: e2e-focus-admin' \
            '  user:' \
            "    token: $E2E_TOKEN" \
            > "$WORKDIR/kubeconfig"

      - name: Generate kubelet TLS
        run: |
          WORKDIR="$PWD/temp/u7s"
          openssl x509 -in "$WORKDIR/ca.crt" -inform DER -out "$WORKDIR/ca.pem" -outform PEM
          sudo cp "$WORKDIR/ca.pem" /etc/kubelet-ca.crt
          sudo chmod 644 /etc/kubelet-ca.crt
          openssl ecparam -genkey -name prime256v1 -noout -out "$WORKDIR/kubelet-tls.key"
          openssl req -new -key "$WORKDIR/kubelet-tls.key" \
            -subj "/CN=ci-node" -sha256 \
            -out "$WORKDIR/kubelet-tls.csr"
          openssl x509 -req -in "$WORKDIR/kubelet-tls.csr" \
            -CA "$WORKDIR/ca.pem" -CAkey "$WORKDIR/ca.key" \
            -CAcreateserial -days 365 -sha256 \
            -extfile <(printf 'subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n') \
            -out "$WORKDIR/kubelet-tls.crt"
          sudo cp "$WORKDIR/kubelet-tls.crt" /etc/kubelet-tls.crt
          sudo cp "$WORKDIR/kubelet-tls.key" /etc/kubelet-tls.key
          sudo chmod 644 /etc/kubelet-tls.crt
          sudo chmod 600 /etc/kubelet-tls.key

      - name: Start kubelet
        run: |
          WORKDIR="$PWD/temp/u7s"
          sudo mkdir -p /tmp/kubelet-pods
          sudo cp "$WORKDIR/kubeconfig" /etc/kubelet-kubeconfig
          sudo chmod 644 /etc/kubelet-kubeconfig
          sudo cp .github/workflows/e2e-focus-resources/kubelet-config.yaml /etc/kubelet-config.yaml
          sudo "$HOME/bin/kubelet" \
            --config=/etc/kubelet-config.yaml \
            --kubeconfig=/etc/kubelet-kubeconfig \
            --hostname-override=ci-node \
            --logging-format=text \
            --v=2 \
            --tls-cert-file=/etc/kubelet-tls.crt \
            --tls-private-key-file=/etc/kubelet-tls.key \
            >"$WORKDIR/kubelet.log" 2>&1 &

      - name: Assert node registers
        env:
          KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
        run: |
          FOUND=0
          for i in $(seq 1 90); do
            if kubectl get nodes 2>/dev/null | grep -q "ci-node"; then
              FOUND=1
              break
            fi
            sleep 1
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: ci-node did not appear in kubectl get nodes within 90s"
            echo "--- apiserver log ---"
            cat "$PWD/temp/u7s/apiserver.log"
            echo "--- kubelet log ---"
            cat "$PWD/temp/u7s/kubelet.log"
            exit 1
          fi
          echo "Node registered:"
          kubectl get nodes

      - name: Assert kubelet not crash-looping
        # Checks every second instead of one sleep-then-check: an immediate
        # crash fails right away instead of waiting out the full window first.
        run: |
          for i in $(seq 1 5); do
            pgrep -f "bin/kubelet --config=/etc/kubelet-config.yaml" >/dev/null || {
              echo "ERROR: kubelet exited"
              cat "$PWD/temp/u7s/kubelet.log"
              exit 1
            }
            sleep 1
          done

      - name: Create kube-proxy RBAC and token
        # The sonobuoy aggregator (and every in-cluster client using client-go's
        # InClusterConfig, i.e. anything with a projected SA token) reaches the
        # apiserver via the "kubernetes" Service ClusterIP (10.96.0.1:443),
        # which needs a real Service dataplane to route -- see kube-proxy below.
        env:
          KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
        run: |
          kubectl create serviceaccount kube-proxy -n kube-system \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl apply --validate=false -f - <<'RBACEOF'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: kube-proxy
          rules:
          - apiGroups: [""]
            resources: [nodes, services, endpoints]
            verbs: [get, list, watch]
          - apiGroups: [""]
            resources: [events]
            verbs: [create, patch, update]
          - apiGroups: [discovery.k8s.io]
            resources: [endpointslices]
            verbs: [get, list, watch]
          - apiGroups: [networking.k8s.io]
            resources: [servicecidrs]
            verbs: [get, list, watch]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: kube-proxy
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: kube-proxy
          subjects:
          - kind: ServiceAccount
            name: kube-proxy
            namespace: kube-system
          RBACEOF
          KUBE_PROXY_TOKEN=$(kubectl create token kube-proxy -n kube-system --duration=8760h)
          echo "KUBE_PROXY_TOKEN=$KUBE_PROXY_TOKEN" >> "$GITHUB_ENV"

      - name: Download kube-proxy
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          WORKDIR="$PWD/temp/u7s"
          curl -fsSL "https://dl.k8s.io/release/v${K8S_VERSION}/bin/linux/amd64/kube-proxy" \
            -o "$WORKDIR/kube-proxy"
          chmod +x "$WORKDIR/kube-proxy"

      - name: Start kube-proxy
        run: |
          WORKDIR="$PWD/temp/u7s"
          sudo mkdir -p /etc/kube-proxy
          sudo tee /etc/kube-proxy/kubeconfig.conf >/dev/null <<KUBEEOF
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
              certificate-authority-data: $(base64 < "$WORKDIR/ca.pem" | tr -d '\n')
            name: default
          contexts:
          - context:
              cluster: default
              user: default
            name: default
          current-context: default
          users:
          - name: default
            user:
              token: ${KUBE_PROXY_TOKEN}
          KUBEEOF
          # iptables mode, not lima's ipvs -- GH Actions runners have the full
          # iptables userspace extensions available (unlike the cut-down Lima
          # VM image that forced ipvs mode there; see
          # scripts/conformance/lima-start.sh's own comment on why), so the
          # simpler mode needs no ipset/kernel-module dependencies beyond
          # br_netfilter below.
          sudo tee /etc/kube-proxy/config.conf >/dev/null <<'CONFEOF'
          apiVersion: kubeproxy.config.k8s.io/v1alpha1
          kind: KubeProxyConfiguration
          mode: iptables
          clusterCIDR: 10.88.0.0/16
          clientConnection:
            kubeconfig: /etc/kube-proxy/kubeconfig.conf
          CONFEOF
          # Required so bridge (pod-to-pod / pod-to-host) traffic passes through
          # netfilter hooks -- without it, kube-proxy's DNAT for ClusterIP
          # services never fires for traffic originating from pods, which is
          # exactly how the sonobuoy aggregator reaches the apiserver.
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1 net.bridge.bridge-nf-call-ip6tables=1
          sudo tee /etc/systemd/system/kube-proxy.service >/dev/null <<SVCEOF
          [Unit]
          Description=Kubernetes Kube Proxy
          After=network.target

          [Service]
          ExecStart=$WORKDIR/kube-proxy \\
            --config=/etc/kube-proxy/config.conf \\
            --hostname-override=ci-node \\
            --v=2
          Restart=always
          RestartSec=5
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target
          SVCEOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now kube-proxy

      - name: Assert kube-proxy active
        run: |
          STATUS=""
          for i in $(seq 1 15); do
            STATUS=$(systemctl is-active kube-proxy 2>&1 || true)
            [ "$STATUS" = "active" ] && break
            sleep 1
          done
          if [ "$STATUS" != "active" ]; then
            echo "ERROR: kube-proxy failed to reach active state (last status: $STATUS)"
            sudo journalctl -u kube-proxy --no-pager -n 50
            exit 1
          fi
          # systemd reporting "active" only means the process started -- it
          # says nothing about whether kube-proxy's first watch-sync has
          # actually programmed the DNAT rule anything dialing the
          # "kubernetes" ClusterIP (10.96.0.1:443, incl. the sonobuoy
          # aggregator) needs. Poll for that rule directly instead of a blind
          # settle-time sleep.
          RULE_READY=0
          for i in $(seq 1 15); do
            if sudo iptables -t nat -S KUBE-SERVICES 2>/dev/null | grep -q "10\.96\.0\.1"; then
              RULE_READY=1
              break
            fi
            sleep 1
          done
          if [ "$RULE_READY" -eq 0 ]; then
            echo "ERROR: kube-proxy did not program a DNAT rule for 10.96.0.1 within 15s"
            sudo iptables -t nat -S KUBE-SERVICES 2>/dev/null || true
            sudo journalctl -u kube-proxy --no-pager -n 50
            exit 1
          fi
          echo "kube-proxy is active and has programmed the kubernetes Service rule"

      - name: Download kube-controller-manager
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          WORKDIR="$PWD/temp/u7s"
          curl -fsSL "https://dl.k8s.io/release/v${K8S_VERSION}/bin/linux/amd64/kube-controller-manager" \
            -o "$WORKDIR/kube-controller-manager"
          chmod +x "$WORKDIR/kube-controller-manager"

      - name: Start kube-controller-manager
        run: |
          WORKDIR="$PWD/temp/u7s"
          # The wildcard controller set (minus cloud-specific controllers u7s does
          # not implement) matches scripts/conformance/04-start-kcm.sh's proven
          # real-conformance configuration -- real upstream e2e specs depend on
          # controllers this workflow's narrower smoke/perf-test peers never
          # needed (e.g. the namespace controller finalizing each test's
          # ephemeral namespace). kcm-supervisor.sh restarts kcm on crash instead
          # of silently blacking out the control plane for the rest of the run.
          setsid bash scripts/conformance/kcm-supervisor.sh \
            "$WORKDIR/kube-controller-manager" "$WORKDIR/kcm.log" \
            --kubeconfig="$WORKDIR/kubeconfig-cert" \
            --cluster-signing-cert-file="$WORKDIR/ca.pem" \
            --cluster-signing-key-file="$WORKDIR/ca.key" \
            --service-account-private-key-file="$WORKDIR/sa.key" \
            --root-ca-file="$WORKDIR/ca.pem" \
            --controllers='*,-cloud-node-lifecycle-controller,-node-ipam-controller,-node-route-controller,-service-lb-controller,-service-cidr-controller' \
            --use-service-account-credentials=false \
            --leader-elect=false \
            --bind-address=127.0.0.1 \
            --kube-api-content-type=application/json \
            >/tmp/kcm-supervisor.log 2>&1 &

      - name: Start u7s-scheduler
        run: |
          WORKDIR="$PWD/temp/u7s"
          # Launched right after kcm, before kcm's own alive-check below --
          # kube-controller-manager and u7s-scheduler are independent apiserver
          # clients with no startup-order dependency on each other (unscheduled
          # pods just stay Pending until the scheduler is up), so there is
          # nothing to gain from serializing their launches.
          ./target/release/u7s-scheduler \
            --kubeconfig "$WORKDIR/kubeconfig-cert" \
            >"$WORKDIR/scheduler.log" 2>&1 &
          echo "SCHEDULER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for kube-controller-manager to be alive
        run: |
          for i in $(seq 1 30); do
            pgrep -f "kube-controller-manager --kubeconfig=" >/dev/null 2>&1 && break
            sleep 1
          done
          pgrep -f "kube-controller-manager --kubeconfig=" >/dev/null 2>&1 || {
            echo "kube-controller-manager failed to start"
            cat "$PWD/temp/u7s/kcm.log" 2>/dev/null || true
            cat /tmp/kcm-supervisor.log
            exit 1
          }

      - name: Assert scheduler alive
        # Checks every second instead of one sleep-then-check: an immediate
        # crash fails right away instead of waiting out the full window first.
        run: |
          for i in $(seq 1 2); do
            kill -0 "$SCHEDULER_PID" 2>/dev/null || {
              echo "u7s-scheduler exited"
              cat "$PWD/temp/u7s/scheduler.log"
              exit 1
            }
            sleep 1
          done

      - name: Sample baseline RSS
        run: |
          sleep 5
          APISERVER_PID=$(pgrep -f "target/release/u7s-apiserver --db" | head -1)
          APISERVER_RSS=$(ps -o rss= -p "$APISERVER_PID" | tr -d ' ')
          SCHEDULER_RSS=$(ps -o rss= -p "$SCHEDULER_PID" | tr -d ' ')
          COMBINED_RSS=$(( APISERVER_RSS + SCHEDULER_RSS ))
          echo "BASELINE_APISERVER_RSS_KB=$APISERVER_RSS" >> "$GITHUB_ENV"
          echo "BASELINE_SCHEDULER_RSS_KB=$SCHEDULER_RSS" >> "$GITHUB_ENV"
          read -r MEM_TOTAL MEM_USED MEM_FREE <<< "$(free -m | awk '/^Mem:/{print $2, $3, $4}')"
          {
            echo "### RSS baseline (k8s ${{ matrix.k8s }}, before sonobuoy)"
            echo "- apiserver RSS: ${APISERVER_RSS} kB"
            echo "- scheduler RSS: ${SCHEDULER_RSS} kB"
            echo "- combined RSS: ${COMBINED_RSS} kB"
            echo "- runner memory (free -m): total=${MEM_TOTAL}MB used=${MEM_USED}MB free=${MEM_FREE}MB"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pre-seed sonobuoy namespace
        env:
          KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
        run: |
          kubectl create namespace sonobuoy --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f scripts/conformance/sonobuoy-namespace-limitrange.yaml

      - name: Run sonobuoy (RollingUpdateDeployment + kubectl exec)
        # Short step-level timeout while this is new and unproven: a hang here
        # should fail fast instead of burning the whole job's timeout-minutes
        # budget on every iteration.
        timeout-minutes: 5
        env:
          KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
        run: |
          sonobuoy run \
            -p scripts/conformance/sonobuoy-plugin-e2e.yaml \
            --wait \
            --skip-preflight=existingnamespace \
            --kubeconfig "$KUBECONFIG" \
            --e2e-focus="RollingUpdateDeployment should delete old pods and create new ones\$|Kubectl client Simple pod should support exec\$"

      - name: Diagnose sonobuoy on failure
        # cancelled() too: interrupting a hung run mid-debug (gh run cancel)
        # produces a "cancelled" conclusion, not "failure" -- without this,
        # exactly the scenario this step exists for would skip it.
        if: failure() || cancelled()
        env:
          KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
        run: |
          echo "=== sonobuoy status ==="
          sonobuoy status --kubeconfig "$KUBECONFIG" || true
          echo "=== pods -n sonobuoy -o wide ==="
          kubectl get pods -n sonobuoy -o wide || true
          echo "=== services -n sonobuoy -o wide ==="
          kubectl get svc -n sonobuoy -o wide || true
          echo "=== describe pods -n sonobuoy ==="
          kubectl describe pods -n sonobuoy || true
          echo "=== events -n sonobuoy ==="
          kubectl get events -n sonobuoy --sort-by=.lastTimestamp || true

          # The sonobuoy results tarball (what "Retrieve sonobuoy results"
          # unpacks on the success path) is only written once the aggregator
          # finishes assembling results from a worker report it never got in
          # a hang like this -- it does not exist on disk yet, so these two
          # containers' own logs are the only place to see what actually
          # happened. Persisted to files (not just echoed) so they survive
          # into the "Upload logs on failure" artifact for offline reading.
          echo "=== aggregator pod logs (sonobuoy/sonobuoy) ==="
          kubectl logs -n sonobuoy sonobuoy | tee /tmp/sonobuoy-aggregator.log || true

          E2E_POD=$(kubectl get pods -n sonobuoy -l sonobuoy-component=plugin -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$E2E_POD" ]; then
            echo "=== e2e-job pod ($E2E_POD) -- e2e container logs (the actual ginkgo run) ==="
            kubectl logs -n sonobuoy "$E2E_POD" -c e2e | tee /tmp/sonobuoy-e2e-container.log || true
            echo "=== e2e-job pod ($E2E_POD) -- sonobuoy-worker container logs (result reporting) ==="
            kubectl logs -n sonobuoy "$E2E_POD" -c sonobuoy-worker | tee /tmp/sonobuoy-worker-container.log || true
          else
            echo "no e2e-job pod found (label sonobuoy-component=plugin)"
          fi

          echo "=== kube-proxy systemd status ==="
          sudo systemctl status kube-proxy --no-pager || true
          echo "=== kube-proxy journal (last 50 lines) ==="
          sudo journalctl -u kube-proxy --no-pager -n 50 || true
          echo "=== iptables nat rules (KUBE-SERVICES/KUBE-SVC chains) ==="
          sudo iptables -t nat -S | grep -i "10.96.0.1\|KUBE-SERVICES\|KUBE-SVC" || true

      - name: Retrieve sonobuoy results
        env:
          KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
        run: |
          TARBALL_NAME=$(kubectl logs -n sonobuoy sonobuoy | grep "Results available at" | tail -1 | grep -oE '[^ /]+\.tar\.gz' || true)
          if [ -z "$TARBALL_NAME" ]; then
            echo "ERROR: could not find results tarball name in sonobuoy logs" >&2
            exit 1
          fi
          POD_UID=$(kubectl get pod -n sonobuoy sonobuoy -o jsonpath='{.metadata.uid}')
          # sonobuoy retrieve relies on the port-forward subresource, which
          # 06-run-sonobuoy.sh's own comment notes u7s does not yet support
          # reliably -- read the results tarball straight off the kubelet's
          # emptyDir volume on disk instead, same as that script's lima
          # workaround minus the VM hop (kubelet runs on this same runner).
          HOST_PATH=$(sudo find "/var/lib/kubelet/pods/${POD_UID}/volumes/kubernetes.io~empty-dir" -name "$TARBALL_NAME" | head -1)
          if [ -z "$HOST_PATH" ]; then
            echo "ERROR: results tarball not found under kubelet pod volume for uid=${POD_UID}" >&2
            exit 1
          fi
          sudo cp "$HOST_PATH" /tmp/sonobuoy-results.tar.gz
          sudo chmod 644 /tmp/sonobuoy-results.tar.gz
          mkdir -p /tmp/sonobuoy-results
          tar xzf /tmp/sonobuoy-results.tar.gz -C /tmp/sonobuoy-results

      - name: Assert sonobuoy PASS
        run: |
          E2E_TXT=$(find /tmp/sonobuoy-results/podlogs -name "e2e.txt" | head -1)
          if [ -z "$E2E_TXT" ]; then
            echo "ERROR: e2e.txt not found under podlogs/**/logs/ in the sonobuoy results" >&2
            find /tmp/sonobuoy-results -maxdepth 4 >&2
            exit 1
          fi
          echo "=== e2e.txt tail ==="
          tail -40 "$E2E_TXT"

          RAN_LINE=$(grep -E "^Ran [0-9]+ of [0-9]+ Specs" "$E2E_TXT" | tail -1 || true)
          echo "Ginkgo ran-count: $RAN_LINE"
          # Exactly 2 -- not zero (the focus regex silently matched nothing,
          # e.g. a FeatureGate label filter or a typo) and not more than 2 (the
          # focus regex over-matched a third, unrelated spec).
          if ! echo "$RAN_LINE" | grep -qE "^Ran 2 of "; then
            echo "ERROR: expected exactly 2 specs to run; got: $RAN_LINE" >&2
            exit 1
          fi

          SUMMARY_LINE=$(grep -E "^SUCCESS!|^FAIL!" "$E2E_TXT" | tail -1 || true)
          echo "Ginkgo summary: $SUMMARY_LINE"
          if ! echo "$SUMMARY_LINE" | grep -q "^SUCCESS!"; then
            echo "ERROR: sonobuoy did not report SUCCESS in e2e.txt (summary: $SUMMARY_LINE)" >&2
            exit 1
          fi
          if ! echo "$SUMMARY_LINE" | grep -q "0 Failed"; then
            echo "ERROR: sonobuoy reported failures in e2e.txt (summary: $SUMMARY_LINE)" >&2
            exit 1
          fi
          echo "PASS: $RAN_LINE / $SUMMARY_LINE"

      - name: Sample peak RSS
        run: |
          APISERVER_PID=$(pgrep -f "target/release/u7s-apiserver --db" | head -1)
          APISERVER_RSS=$(ps -o rss= -p "$APISERVER_PID" | tr -d ' ')
          SCHEDULER_RSS=$(ps -o rss= -p "$SCHEDULER_PID" | tr -d ' ')
          COMBINED_RSS=$(( APISERVER_RSS + SCHEDULER_RSS ))
          BASELINE_COMBINED=$(( BASELINE_APISERVER_RSS_KB + BASELINE_SCHEDULER_RSS_KB ))
          DELTA=$(( COMBINED_RSS - BASELINE_COMBINED ))
          read -r MEM_TOTAL MEM_USED MEM_FREE <<< "$(free -m | awk '/^Mem:/{print $2, $3, $4}')"
          {
            echo "### RSS peak (k8s ${{ matrix.k8s }}, after sonobuoy)"
            echo "- apiserver RSS: ${APISERVER_RSS} kB (baseline ${BASELINE_APISERVER_RSS_KB} kB)"
            echo "- scheduler RSS: ${SCHEDULER_RSS} kB (baseline ${BASELINE_SCHEDULER_RSS_KB} kB)"
            echo "- combined RSS: ${COMBINED_RSS} kB (delta vs. baseline: ${DELTA} kB)"
            echo "- runner memory (free -m): total=${MEM_TOTAL}MB used=${MEM_USED}MB free=${MEM_FREE}MB"
            echo ""
            echo "No threshold is enforced yet -- this run only collects baseline data."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop stack
        if: always()
        run: |
          [ -n "${SCHEDULER_PID:-}" ] && kill "$SCHEDULER_PID" 2>/dev/null || true
          pkill -f "kcm-supervisor.sh" 2>/dev/null || true
          pkill -f "kube-controller-manager --kubeconfig=" 2>/dev/null || true
          sudo systemctl stop kube-proxy 2>/dev/null || true
          sudo pkill -f "bin/kubelet --config=/etc/kubelet-config.yaml" 2>/dev/null || true
          pkill -f "target/release/u7s-apiserver --db" 2>/dev/null || true

      - name: Upload logs on failure
        # cancelled() too -- confirmed live that a manual `gh run cancel`
        # (used to interrupt a hang instead of waiting out the full job
        # timeout) produces a "cancelled" job conclusion, which a bare
        # if: failure() does not match, so this step silently skipped on
        # exactly the runs it exists to capture logs for.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-focus-logs-${{ matrix.k8s }}
          path: |
            temp/u7s/apiserver.log
            temp/u7s/scheduler.log
            temp/u7s/kubelet.log
            temp/u7s/kcm.log
            /tmp/kcm-supervisor.log
            /tmp/sonobuoy-results.tar.gz
            /tmp/sonobuoy-aggregator.log
            /tmp/sonobuoy-e2e-container.log
            /tmp/sonobuoy-worker-container.log
