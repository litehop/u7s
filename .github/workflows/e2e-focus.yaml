name: E2E focus

on:
  push:
    branches:
      - main
  pull_request:
  # Without this, the merge queue's temporary branch never fires this
  # workflow, so its required check can never report and the queue
  # deadlocks waiting forever for a check that will never arrive.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: OS version
        id: os-version
        run: |
          . /etc/os-release
          echo "v=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: rustc version
        id: rustc-version
        run: echo "v=$(rustc -V)" >> "$GITHUB_OUTPUT"
      - name: Restore release binary cache
        id: release-bin-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/u7s-apiserver
            target/release/u7s-scheduler
          key: release-bin-${{ runner.os }}-${{ steps.os-version.outputs.v }}-${{ runner.arch }}-${{ steps.rustc-version.outputs.v }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'crates/**/*.proto') }}
      - name: Build release binaries
        if: steps.release-bin-cache.outputs.cache-hit != 'true'
        run: cargo build --release --timings -p u7s-apiserver -p u7s-scheduler
      # --timings writes target/cargo-timings/cargo-timing.html; upload it even on
      # build failure (a timeout still yields a partial report) but only when the
      # build actually ran -- a cache hit produces no report.
      - name: Upload build timings report
        if: always() && steps.release-bin-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: u7s-e2e-focus-build-timings
          path: target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7
      # actions/cache's combined action saves unconditionally on a cache miss in its
      # Post step, even if the build step failed. Split restore/save lets us gate the
      # save on build success so a partially-failed build is never cached as valid.
      - name: Save release binary cache
        if: steps.release-bin-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/u7s-apiserver
            target/release/u7s-scheduler
          key: release-bin-${{ runner.os }}-${{ steps.os-version.outputs.v }}-${{ runner.arch }}-${{ steps.rustc-version.outputs.v }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'crates/**/*.proto') }}
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: u7s-e2e-focus-binaries
          path: |
            target/release/u7s-apiserver
            target/release/u7s-scheduler
          retention-days: 1

  e2e-focus:
    needs: build
    runs-on: ubuntu-latest
    # Tight while the sonobuoy step below is unproven -- a hang anywhere in
    # this job should fail fast instead of burning 20+ minutes per iteration.
    # Raise once sonobuoy is confirmed reliably completing.
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.11", "1.35.8", "1.36.4"]
    name: e2e-focus ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run baseline e2e-focus
        uses: ./.github/actions/e2e-focus-run
        with:
          k8s_version: ${{ matrix.k8s }}
          focus: "RollingUpdateDeployment should delete old pods and create new ones|Kubectl logs logs should be able to retrieve and filter logs|Job should adopt matching orphans and release non-matching pods|ConfigMap should be consumable in multiple volumes in the same pod"
          expected_specs: "4"
          run_label: e2e-focus

  # Guards known-recurring-regression files (.githooks/sensitive-conformance-focus.yaml)
  # on CI instead of the local Lima pre-push hook -- the runner has no Lima
  # usernet gateway, the failure class that made the local gate flaky. The job
  # ALWAYS runs and ALWAYS reports (quick-succeeds when the diff touches no
  # registered file), so it is safe to make a required check with no
  # merge-queue skip deadlock.
  sensitive-e2e-guard:
    needs: build
    runs-on: ubuntu-latest
    # Same fail-fast budget as e2e-focus; the composite action bounds the
    # sonobuoy step itself at 5 min.
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.11", "1.35.8", "1.36.4"]
    name: sensitive-e2e-guard ${{ matrix.k8s }}
    steps:
      # Full history so the detect step can diff the push/PR/merge-group range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect sensitive-file diff
        id: detect
        # SHAs passed via env, never interpolated into the script body, so an
        # attacker-controlled ref name can't inject shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT_NAME" in
            pull_request) RANGE="${PR_BASE}...${PR_HEAD}" ;;
            merge_group)  RANGE="${MG_BASE}...${MG_HEAD}" ;;
            push)
              # Diff the branch's WHOLE divergence from main, not just the
              # pushed commits: before..after would miss a sensitive change made
              # in an earlier commit that the latest push didn't touch (and is
              # all-zeros on a branch's first push). merge-base with main covers
              # the full branch footprint regardless of how it was pushed. On a
              # push to main itself the merge-base IS HEAD, so fall back to the
              # just-pushed commits there.
              git fetch --no-tags --quiet origin main || true
              BASE=$(git merge-base FETCH_HEAD HEAD 2>/dev/null || true)
              if [ -n "$BASE" ] && [ "$BASE" != "$(git rev-parse HEAD)" ]; then
                RANGE="${BASE}..HEAD"
              else
                RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
                case "$PUSH_BEFORE" in 0000000*) RANGE="HEAD^..HEAD" ;; esac
              fi
              ;;
            *) RANGE="HEAD^..HEAD" ;;
          esac
          echo "event=$EVENT_NAME range=$RANGE"
          CHANGED=$(mktemp)
          git diff --name-only "$RANGE" > "$CHANGED"
          echo "--- changed files ---"
          cat "$CHANGED"
          echo "--- detector output ---"
          scripts/sensitive-focus-for-diff.sh "$CHANGED" .githooks/sensitive-conformance-focus.yaml | tee -a "$GITHUB_OUTPUT"
      - name: No sensitive file touched -- skipping sonobuoy
        if: steps.detect.outputs.sensitive != 'true'
        run: echo "No registered sensitive file in this diff; sensitive-e2e-guard passes without a sonobuoy run."
      - name: Run sensitive-conformance focus
        if: steps.detect.outputs.sensitive == 'true'
        uses: ./.github/actions/e2e-focus-run
        with:
          k8s_version: ${{ matrix.k8s }}
          focus: ${{ steps.detect.outputs.focus }}
          expected_specs: ${{ steps.detect.outputs.expected_specs }}
          run_label: sensitive-e2e-guard
