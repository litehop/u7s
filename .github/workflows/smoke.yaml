name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  kubectl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.8", "1.35.5", "1.36.1"]
    name: kubectl ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install kubectl ${{ matrix.k8s }}
        run: |
          MINOR=$(echo "${{ matrix.k8s }}" | cut -d. -f1-2)
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades "kubectl=${{ matrix.k8s }}-*"
          sudo apt-mark hold kubectl

      - name: Build release binary
        run: cargo build --release -p u7s-apiserver

      - name: Start apiserver
        env:
          RUST_LOG: info
        run: |
          TMPDIR=$(mktemp -d)
          echo "SMOKE_TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          # Static admin token — maps to system:masters group, bypasses RBAC.
          SMOKE_TOKEN="smoke-admin-token-$(date +%s)"
          echo "$SMOKE_TOKEN,smoke-admin,uid0,system:masters" > "$TMPDIR/token-auth.csv"
          ./target/release/u7s-apiserver \
            --db "$TMPDIR/state.db" \
            --kubeconfig "$TMPDIR/kubeconfig" \
            --sa-key "$TMPDIR/sa.key" \
            --sa-pub "$TMPDIR/sa.pub" \
            --token-auth-file "$TMPDIR/token-auth.csv" \
            --advertise-address https://127.0.0.1:6443 \
            >"$TMPDIR/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait up to 30s for the server to accept TCP connections on 6443
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 2>/dev/null && break
            sleep 1
          done
          nc -z 127.0.0.1 6443 2>/dev/null || { echo "Server did not start"; cat "$TMPDIR/server.log"; exit 1; }
          # Overwrite the cert-based kubeconfig with a token-based one for the smoke job.
          # Token auth is simpler to provision statically; x509 client cert auth is also
          # implemented (PR #33) but token avoids needing cert distribution here.
          CA_DATA=$(grep "certificate-authority-data" "$TMPDIR/kubeconfig" | awk '{print $2}')
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
          # Write token-based kubeconfig with printf to avoid heredoc/YAML nesting issues.
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    server: https://127.0.0.1:6443' \
            "    certificate-authority-data: $CA_DATA" \
            '  name: u7s' \
            'contexts:' \
            '- context:' \
            '    cluster: u7s' \
            '    user: smoke-admin' \
            '  name: u7s' \
            'current-context: u7s' \
            'users:' \
            '- name: smoke-admin' \
            '  user:' \
            "    token: $SMOKE_TOKEN" \
            > "$TMPDIR/kubeconfig"

      - name: Namespace CRUD
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl create namespace smoke-test
          kubectl get namespace smoke-test
          kubectl get namespaces | grep smoke-test

      - name: Watch stream
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          WATCH_OUT=$(mktemp)
          # Use curl to hit the raw watch endpoint so the server's NDJSON envelope
          # ({"type":"ADDED","object":{...}}) is preserved in the output.
          # kubectl get --watch -o json strips the event type field, so ADDED/DELETED
          # never appear in its output — the curl approach avoids that.
          CA_CERT="$SMOKE_TMPDIR/ca.crt"
          kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' \
            | base64 -d > "$CA_CERT"
          curl --silent --no-buffer \
            --cacert "$CA_CERT" \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "https://127.0.0.1:6443/api/v1/namespaces?watch=true" \
            >"$WATCH_OUT" 2>&1 &
          WATCH_PID=$!

          # Create namespace — should trigger an ADDED event on the watch stream.
          kubectl create namespace watch-test

          # Wait up to 10s for the watch output to contain the namespace name and ADDED.
          ADDED=0
          for i in $(seq 1 10); do
            if grep -q "watch-test" "$WATCH_OUT" && grep -q "ADDED" "$WATCH_OUT"; then
              ADDED=1
              break
            fi
            sleep 1
          done

          # Delete namespace — should trigger a DELETED event.
          kubectl delete namespace watch-test

          # Wait up to 10s for the DELETED event.
          DELETED=0
          for i in $(seq 1 10); do
            if grep -q "DELETED" "$WATCH_OUT"; then
              DELETED=1
              break
            fi
            sleep 1
          done

          kill "$WATCH_PID" 2>/dev/null || true

          if [ "$ADDED" -eq 0 ]; then
            echo "ERROR: ADDED event for watch-test did not arrive within 10s"
            echo "--- watch output ---"
            cat "$WATCH_OUT"
            exit 1
          fi
          if [ "$DELETED" -eq 0 ]; then
            echo "ERROR: DELETED event for watch-test did not arrive within 10s"
            echo "--- watch output ---"
            cat "$WATCH_OUT"
            exit 1
          fi

      - name: ConfigMap CRUD
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl create configmap smoke-cm --from-literal=key=value --namespace smoke-test
          kubectl get configmap smoke-cm --namespace smoke-test
          kubectl get configmaps --namespace smoke-test | grep smoke-cm

      - name: CRD create and get
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl apply --validate=false -f - <<'EOF'
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: foos.smoke.u7s.dev
          spec:
            group: smoke.u7s.dev
            names:
              kind: Foo
              plural: foos
              singular: foo
            scope: Cluster
            versions:
              - name: v1alpha1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    type: object
                    properties:
                      spec:
                        type: object
          EOF
          kubectl get crd foos.smoke.u7s.dev

      - name: CR instance create and get
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl apply --validate=false -f - <<'EOF'
          apiVersion: smoke.u7s.dev/v1alpha1
          kind: Foo
          metadata:
            name: smoke-foo
          spec: {}
          EOF
          kubectl get foo smoke-foo

      - name: Stop apiserver
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-server-log-${{ matrix.k8s }}
          path: ${{ env.SMOKE_TMPDIR }}/server.log

  kubelet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.8", "1.35.5", "1.36.1"]
    name: kubelet ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cri-o and crun
        run: |
          MINOR=$(echo "${{ matrix.k8s }}" | cut -d. -f1-2)
          sudo apt-get update -qq
          sudo apt-get install -y apt-transport-https ca-certificates curl gpg
          curl -fsSL "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/cri-o.list
          sudo apt-get update -qq
          sudo apt-get install -y cri-o crun
          sudo mkdir -p /etc/crio/crio.conf.d
          printf '[crio.runtime]\ndefault_runtime = "crun"\n[crio.runtime.runtimes.crun]\nruntime_path = "/usr/bin/crun"\nruntime_type = "oci"\nruntime_root = "/run/crun"\n' \
            | sudo tee /etc/crio/crio.conf.d/10-crun.conf
          sudo systemctl enable --now crio

      - name: Install kubelet and kubectl ${{ matrix.k8s }}
        run: |
          MINOR=$(echo "${{ matrix.k8s }}" | cut -d. -f1-2)
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades "kubelet=${{ matrix.k8s }}-*" "kubectl=${{ matrix.k8s }}-*"
          sudo apt-mark hold kubelet kubectl
          sudo systemctl disable --now kubelet

      - name: Build release binary
        run: cargo build --release -p u7s-apiserver

      - name: Start apiserver
        env:
          RUST_LOG: info
        run: |
          TMPDIR=$(mktemp -d)
          echo "SMOKE_TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          SMOKE_TOKEN="kubelet-admin-token-$(date +%s)"
          echo "$SMOKE_TOKEN,kubelet-admin,uid0,system:masters" > "$TMPDIR/token-auth.csv"
          ./target/release/u7s-apiserver \
            --db "$TMPDIR/state.db" \
            --kubeconfig "$TMPDIR/kubeconfig" \
            --sa-key "$TMPDIR/sa.key" \
            --sa-pub "$TMPDIR/sa.pub" \
            --token-auth-file "$TMPDIR/token-auth.csv" \
            --advertise-address https://127.0.0.1:6443 \
            >"$TMPDIR/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 2>/dev/null && break
            sleep 1
          done
          nc -z 127.0.0.1 6443 2>/dev/null || { echo "Server did not start"; cat "$TMPDIR/server.log"; exit 1; }
          CA_DATA=$(grep "certificate-authority-data" "$TMPDIR/kubeconfig" | awk '{print $2}')
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    server: https://127.0.0.1:6443' \
            "    certificate-authority-data: $CA_DATA" \
            '  name: u7s' \
            'contexts:' \
            '- context:' \
            '    cluster: u7s' \
            '    user: kubelet-admin' \
            '  name: u7s' \
            'current-context: u7s' \
            'users:' \
            '- name: kubelet-admin' \
            '  user:' \
            "    token: $SMOKE_TOKEN" \
            > "$TMPDIR/kubeconfig"

      - name: Start kubelet
        run: |
          TMPDIR="${{ env.SMOKE_TMPDIR }}"
          sudo mkdir -p /tmp/kubelet-pods
          sudo cp "$TMPDIR/kubeconfig" /etc/kubelet-kubeconfig
          sudo chmod 644 /etc/kubelet-kubeconfig
          sudo tee /etc/kubelet-config.yaml <<'EOF'
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          containerRuntimeEndpoint: unix:///var/run/crio/crio.sock
          registerNode: true
          failSwapOn: false
          resolvConf: ""
          staticPodPath: /tmp/kubelet-pods
          EOF
          sudo kubelet \
            --config=/etc/kubelet-config.yaml \
            --kubeconfig=/etc/kubelet-kubeconfig \
            --hostname-override=ci-node \
            --v=2 \
            >"$TMPDIR/kubelet.log" 2>&1 &
          echo "KUBELET_PID=$!" >> "$GITHUB_ENV"

      - name: Assert node registers
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          FOUND=0
          for i in $(seq 1 90); do
            if kubectl get nodes 2>/dev/null | grep -q "ci-node"; then
              FOUND=1
              break
            fi
            sleep 1
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: ci-node did not appear in kubectl get nodes within 60s"
            echo "--- server log ---"
            cat "${{ env.SMOKE_TMPDIR }}/server.log"
            echo "--- kubelet log ---"
            cat "${{ env.SMOKE_TMPDIR }}/kubelet.log"
            exit 1
          fi
          echo "Node registered:"
          kubectl get nodes

      - name: Assert node reaches Ready
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          READY=0
          for i in $(seq 1 60); do
            STATUS=$(kubectl get node ci-node \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
            if [ "$STATUS" = "True" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -eq 0 ]; then
            echo "ERROR: ci-node did not reach Ready=True within 120s"
            kubectl describe node ci-node || true
            echo "--- server log ---"
            cat "${{ env.SMOKE_TMPDIR }}/server.log"
            echo "--- kubelet log ---"
            cat "${{ env.SMOKE_TMPDIR }}/kubelet.log"
            exit 1
          fi
          echo "Node is Ready:"
          kubectl get node ci-node

      - name: Assert kubelet not crash-looping
        run: |
          sleep 5
          if ! kill -0 "$KUBELET_PID" 2>/dev/null; then
            echo "ERROR: kubelet exited"
            cat "${{ env.SMOKE_TMPDIR }}/kubelet.log"
            exit 1
          fi

      - name: Stop server and kubelet
        if: always()
        run: |
          [ -n "$SERVER_PID" ] && kill "$SERVER_PID" 2>/dev/null || true
          [ -n "$KUBELET_PID" ] && sudo kill "$KUBELET_PID" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubelet-smoke-logs-${{ matrix.k8s }}
          path: |
            ${{ env.SMOKE_TMPDIR }}/server.log
            ${{ env.SMOKE_TMPDIR }}/kubelet.log
