name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --release -p u7s-apiserver
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: u7s-apiserver
          path: target/release/u7s-apiserver
          retention-days: 1

  kubectl:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.8", "1.35.5", "1.36.1"]
    name: kubectl ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: u7s-apiserver
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/u7s-apiserver

      - name: Add ~/bin to PATH
        run: |
          mkdir -p ~/bin
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache kubectl ${{ matrix.k8s }}
        id: cache-kubectl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/bin/kubectl
          key: kubectl-${{ matrix.k8s }}-${{ runner.arch }}

      - name: Install kubectl ${{ matrix.k8s }}
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          MINOR=$(echo "$K8S_VERSION" | cut -d. -f1-2)
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades "kubectl=$K8S_VERSION-*"
          sudo apt-mark hold kubectl
          mkdir -p ~/bin
          cp /usr/bin/kubectl ~/bin/kubectl

      - name: Start apiserver
        env:
          RUST_LOG: info
        run: |
          TMPDIR=$(mktemp -d)
          echo "SMOKE_TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          # Static admin token — maps to system:masters group, bypasses RBAC.
          SMOKE_TOKEN="smoke-admin-token-$(date +%s)"
          echo "$SMOKE_TOKEN,smoke-admin,uid0,system:masters" > "$TMPDIR/token-auth.csv"
          ./target/release/u7s-apiserver \
            --db "$TMPDIR/state.db" \
            --kubeconfig "$TMPDIR/kubeconfig" \
            --sa-key "$TMPDIR/sa.key" \
            --sa-pub "$TMPDIR/sa.pub" \
            --token-auth-file "$TMPDIR/token-auth.csv" \
            --advertise-address https://127.0.0.1:6443 \
            --service-cluster-ip-range "10.96.0.0/12" \
            >"$TMPDIR/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait up to 30s for the server to accept TCP connections on 6443
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 2>/dev/null && break
            sleep 1
          done
          nc -z 127.0.0.1 6443 2>/dev/null || { echo "Server did not start"; cat "$TMPDIR/server.log"; exit 1; }
          # Overwrite the cert-based kubeconfig with a token-based one for the smoke job.
          # Token auth is simpler to provision statically; x509 client cert auth is also
          # implemented (PR #33) but token avoids needing cert distribution here.
          CA_DATA=$(grep "certificate-authority-data" "$TMPDIR/kubeconfig" | awk '{print $2}')
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
          # Write token-based kubeconfig with printf to avoid heredoc/YAML nesting issues.
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    server: https://127.0.0.1:6443' \
            "    certificate-authority-data: $CA_DATA" \
            '  name: u7s' \
            'contexts:' \
            '- context:' \
            '    cluster: u7s' \
            '    user: smoke-admin' \
            '  name: u7s' \
            'current-context: u7s' \
            'users:' \
            '- name: smoke-admin' \
            '  user:' \
            "    token: $SMOKE_TOKEN" \
            > "$TMPDIR/kubeconfig"

      - name: Namespace CRUD
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl create namespace smoke-test
          kubectl get namespace smoke-test
          kubectl get namespaces | grep smoke-test

      - name: Watch stream
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          WATCH_OUT=$(mktemp)
          # Use curl to hit the raw watch endpoint so the server's NDJSON envelope
          # ({"type":"ADDED","object":{...}}) is preserved in the output.
          # kubectl get --watch -o json strips the event type field, so ADDED/DELETED
          # never appear in its output — the curl approach avoids that.
          CA_CERT="$SMOKE_TMPDIR/ca.crt"
          kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' \
            | base64 -d > "$CA_CERT"
          curl --silent --no-buffer \
            --cacert "$CA_CERT" \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "https://127.0.0.1:6443/api/v1/namespaces?watch=true" \
            >"$WATCH_OUT" 2>&1 &
          WATCH_PID=$!

          # Create namespace — should trigger an ADDED event on the watch stream.
          kubectl create namespace watch-test

          # Wait up to 10s for the watch output to contain the namespace name and ADDED.
          ADDED=0
          for i in $(seq 1 10); do
            if grep -q "watch-test" "$WATCH_OUT" && grep -q "ADDED" "$WATCH_OUT"; then
              ADDED=1
              break
            fi
            sleep 1
          done

          # Remove the kubernetes finalizer before deleting — in production this is
          # done by kube-controller-manager after draining child resources, but the
          # kubectl smoke job does not run kcm.  Without removing the finalizer the
          # namespace stays in Terminating indefinitely and no DELETED event fires.
          kubectl patch namespace watch-test \
            -p '{"spec":{"finalizers":[]}}' --type=merge
          # Delete namespace — should trigger a DELETED event.
          kubectl delete namespace watch-test

          # Wait up to 10s for the DELETED event.
          DELETED=0
          for i in $(seq 1 10); do
            if grep -q "DELETED" "$WATCH_OUT"; then
              DELETED=1
              break
            fi
            sleep 1
          done

          kill "$WATCH_PID" 2>/dev/null || true

          if [ "$ADDED" -eq 0 ]; then
            echo "ERROR: ADDED event for watch-test did not arrive within 10s"
            echo "--- watch output ---"
            cat "$WATCH_OUT"
            exit 1
          fi
          if [ "$DELETED" -eq 0 ]; then
            echo "ERROR: DELETED event for watch-test did not arrive within 10s"
            echo "--- watch output ---"
            cat "$WATCH_OUT"
            exit 1
          fi

      - name: ConfigMap CRUD
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl create configmap smoke-cm --from-literal=key=value --namespace smoke-test
          kubectl get configmap smoke-cm --namespace smoke-test
          kubectl get configmaps --namespace smoke-test | grep smoke-cm

      - name: CRD create and get
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl apply --validate=false -f - <<'EOF'
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: foos.smoke.u7s.dev
          spec:
            group: smoke.u7s.dev
            names:
              kind: Foo
              plural: foos
              singular: foo
            scope: Cluster
            versions:
              - name: v1alpha1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    type: object
                    properties:
                      spec:
                        type: object
          EOF
          kubectl get crd foos.smoke.u7s.dev

      - name: CR instance create and get
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl apply --validate=false -f - <<'EOF'
          apiVersion: smoke.u7s.dev/v1alpha1
          kind: Foo
          metadata:
            name: smoke-foo
          spec: {}
          EOF
          kubectl get foo smoke-foo

      - name: Stop apiserver
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-server-log-${{ matrix.k8s }}
          path: ${{ env.SMOKE_TMPDIR }}/server.log

  kubelet:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.8", "1.35.5", "1.36.1"]
    name: kubelet ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: u7s-apiserver
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/u7s-apiserver

      - name: Add ~/bin to PATH
        run: |
          mkdir -p ~/bin
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install cri-o and crun
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          MINOR=$(echo "$K8S_VERSION" | cut -d. -f1-2)
          sudo apt-get update -qq
          sudo apt-get install -y apt-transport-https ca-certificates curl gpg
          curl -fsSL "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/cri-o.list
          sudo apt-get update -qq
          sudo apt-get install -y cri-o
          # CRI-O ships its own crun binary that is ABI-compatible with the OCI spec
          # version it generates (1.2.x for CRI-O 1.34+). The Ubuntu system crun
          # (1.4.5 on 22.04) only accepts OCI spec 1.0/1.1 and returns
          # "unknown version specified" when CRI-O passes a 1.2 spec — do NOT
          # install system crun or override CRI-O's bundled runtime path.
          # Install a minimal bridge CNI config so CRI-O can find at least one
          # conflist at startup (required even for hostNetwork pods).
          # Use cniVersion 0.4.0 and only bridge+host-local to avoid depending on
          # portmap/firewall/tuning which are not always in /opt/cni/bin.
          sudo mkdir -p /etc/cni/net.d
          sudo tee /etc/cni/net.d/10-bridge.conflist <<'CNIEOF'
          {
            "cniVersion": "0.4.0",
            "name": "bridge",
            "plugins": [
              {
                "type": "bridge",
                "bridge": "cni0",
                "isGateway": true,
                "ipMasq": true,
                "hairpinMode": true,
                "ipam": {
                  "type": "host-local",
                  "ranges": [[{"subnet": "10.88.0.0/16"}]],
                  "routes": [{"dst": "0.0.0.0/0"}]
                }
              }
            ]
          }
          CNIEOF
          sudo systemctl enable --now crio

      - name: Cache kubelet and kubectl ${{ matrix.k8s }}
        id: cache-kubelet
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/bin/kubelet
            ~/bin/kubectl
          key: kubelet-kubectl-${{ matrix.k8s }}-${{ runner.arch }}

      - name: Install kubelet and kubectl ${{ matrix.k8s }}
        if: steps.cache-kubelet.outputs.cache-hit != 'true'
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          MINOR=$(echo "$K8S_VERSION" | cut -d. -f1-2)
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades "kubelet=$K8S_VERSION-*" "kubectl=$K8S_VERSION-*"
          sudo apt-mark hold kubelet kubectl
          sudo systemctl disable --now kubelet
          mkdir -p ~/bin
          cp /usr/bin/kubelet ~/bin/kubelet
          cp /usr/bin/kubectl ~/bin/kubectl
          # Install containernetworking-plugins after kubelet; use dpkg force-overwrite
          # to handle file conflicts with the kubernetes-cni package.
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" containernetworking-plugins

      - name: Start apiserver
        env:
          RUST_LOG: info
        run: |
          TMPDIR=$(mktemp -d)
          echo "SMOKE_TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          SMOKE_TOKEN="kubelet-admin-token-$(date +%s)"
          echo "$SMOKE_TOKEN,kubelet-admin,uid0,system:masters" > "$TMPDIR/token-auth.csv"
          ./target/release/u7s-apiserver \
            --db "$TMPDIR/state.db" \
            --kubeconfig "$TMPDIR/kubeconfig" \
            --sa-key "$TMPDIR/sa.key" \
            --sa-pub "$TMPDIR/sa.pub" \
            --token-auth-file "$TMPDIR/token-auth.csv" \
            --advertise-address https://127.0.0.1:6443 \
            --service-cluster-ip-range "10.96.0.0/12" \
            >"$TMPDIR/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 2>/dev/null && break
            sleep 1
          done
          nc -z 127.0.0.1 6443 2>/dev/null || { echo "Server did not start"; cat "$TMPDIR/server.log"; exit 1; }
          CA_DATA=$(grep "certificate-authority-data" "$TMPDIR/kubeconfig" | awk '{print $2}')
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    server: https://127.0.0.1:6443' \
            "    certificate-authority-data: $CA_DATA" \
            '  name: u7s' \
            'contexts:' \
            '- context:' \
            '    cluster: u7s' \
            '    user: kubelet-admin' \
            '  name: u7s' \
            'current-context: u7s' \
            'users:' \
            '- name: kubelet-admin' \
            '  user:' \
            "    token: $SMOKE_TOKEN" \
            > "$TMPDIR/kubeconfig"

      - name: Start kubelet
        run: |
          TMPDIR="${{ env.SMOKE_TMPDIR }}"
          sudo mkdir -p /tmp/kubelet-pods
          sudo cp "$TMPDIR/kubeconfig" /etc/kubelet-kubeconfig
          sudo chmod 644 /etc/kubelet-kubeconfig
          sudo tee /etc/kubelet-config.yaml <<'EOF'
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          containerRuntimeEndpoint: unix:///var/run/crio/crio.sock
          registerNode: true
          failSwapOn: false
          resolvConf: ""
          staticPodPath: /tmp/kubelet-pods
          EOF
          sudo "$HOME/bin/kubelet" \
            --config=/etc/kubelet-config.yaml \
            --kubeconfig=/etc/kubelet-kubeconfig \
            --hostname-override=ci-node \
            --logging-format=text \
            --v=2 \
            >"$TMPDIR/kubelet.log" 2>&1 &
          echo "KUBELET_PID=$!" >> "$GITHUB_ENV"

      - name: Assert node registers
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          FOUND=0
          for i in $(seq 1 90); do
            if kubectl get nodes 2>/dev/null | grep -q "ci-node"; then
              FOUND=1
              break
            fi
            sleep 1
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: ci-node did not appear in kubectl get nodes within 60s"
            echo "--- server log ---"
            cat "${{ env.SMOKE_TMPDIR }}/server.log"
            echo "--- kubelet log ---"
            cat "${{ env.SMOKE_TMPDIR }}/kubelet.log"
            exit 1
          fi
          echo "Node registered:"
          kubectl get nodes

      - name: Assert kubelet not crash-looping
        run: |
          sleep 5
          if ! kill -0 "$KUBELET_PID" 2>/dev/null; then
            echo "ERROR: kubelet exited"
            cat "${{ env.SMOKE_TMPDIR }}/kubelet.log"
            exit 1
          fi

      - name: Pod lifecycle (schedule → Succeeded)
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          # Create a one-shot pod bound to ci-node via nodeName.
          # hostNetwork+dnsPolicy:None avoids ClusterDNS errors (kubelet warns when
          # no DNS is configured; dnsPolicy:None suppresses that path entirely).
          # restartPolicy:Never + busybox exit 0 means the pod reaches Succeeded
          # without a scheduler or any other infrastructure.
          kubectl apply --validate=false -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-pod
            namespace: default
          spec:
            nodeName: ci-node
            hostNetwork: true
            dnsPolicy: None
            dnsConfig: {}
            restartPolicy: Never
            containers:
              - name: hello
                image: busybox:1.36
                command: ["sh", "-c", "echo hello"]
          EOF

          # Wait up to 120s for the pod to reach Succeeded.
          # ContainerCreating → Running → Succeeded is the expected path.
          SUCCEEDED=0
          for i in $(seq 1 120); do
            PHASE=$(kubectl get pod smoke-pod -n default -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [ "$PHASE" = "Succeeded" ]; then
              SUCCEEDED=1
              break
            fi
            if [ "$PHASE" = "Failed" ]; then
              echo "ERROR: pod entered Failed phase"
              kubectl describe pod smoke-pod -n default
              echo "--- kubelet log ---"
              cat "${{ env.SMOKE_TMPDIR }}/kubelet.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$SUCCEEDED" -eq 0 ]; then
            PHASE=$(kubectl get pod smoke-pod -n default -o jsonpath='{.status.phase}' 2>/dev/null || echo "unknown")
            echo "ERROR: pod did not reach Succeeded within 120s (current phase: $PHASE)"
            kubectl describe pod smoke-pod -n default
            echo "--- kubelet log (last 100 lines) ---"
            tail -100 "${{ env.SMOKE_TMPDIR }}/kubelet.log"
            echo "--- server log (last 50 lines) ---"
            tail -50 "${{ env.SMOKE_TMPDIR }}/server.log"
            exit 1
          fi
          echo "Pod reached Succeeded:"
          kubectl get pod smoke-pod -n default

      - name: ConfigMap volume mount
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          # Create a ConfigMap whose data will be projected into a pod volume.
          kubectl create configmap hello-config \
            --from-literal=greeting=hello \
            --namespace default

          # Create a one-shot pod directly (no Deployment — no controller-manager
          # in this job).  nodeName binds it to ci-node without a scheduler.
          # hostNetwork+dnsPolicy:None suppresses DNS errors.
          # The container reads the mounted file; exit 0 confirms the mount worked.
          kubectl apply --validate=false -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: configmap-pod
            namespace: default
          spec:
            nodeName: ci-node
            hostNetwork: true
            dnsPolicy: None
            dnsConfig: {}
            restartPolicy: Never
            containers:
              - name: reader
                image: busybox:1.36
                command: ["cat", "/etc/config/greeting"]
                volumeMounts:
                  - name: config-vol
                    mountPath: /etc/config
            volumes:
              - name: config-vol
                configMap:
                  name: hello-config
          EOF

          # Wait up to 60s for the pod to reach Succeeded.
          SUCCEEDED=0
          for i in $(seq 1 60); do
            PHASE=$(kubectl get pod configmap-pod -n default \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [ "$PHASE" = "Succeeded" ]; then
              SUCCEEDED=1
              break
            fi
            if [ "$PHASE" = "Failed" ]; then
              echo "ERROR: pod entered Failed phase"
              kubectl describe pod configmap-pod -n default
              echo "--- kubelet log ---"
              cat "${{ env.SMOKE_TMPDIR }}/kubelet.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$SUCCEEDED" -eq 0 ]; then
            PHASE=$(kubectl get pod configmap-pod -n default \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "unknown")
            echo "ERROR: configmap-pod did not reach Succeeded within 60s (phase: $PHASE)"
            kubectl describe pod configmap-pod -n default
            echo "--- kubelet log (last 60 lines) ---"
            tail -60 "${{ env.SMOKE_TMPDIR }}/kubelet.log"
            echo "--- server log (last 30 lines) ---"
            tail -30 "${{ env.SMOKE_TMPDIR }}/server.log"
            exit 1
          fi
          echo "ConfigMap volume mount verified (pod Succeeded):"
          kubectl get pod configmap-pod -n default

          # Clean up.
          kubectl delete pod configmap-pod --namespace default
          kubectl delete configmap hello-config --namespace default

      - name: Stop server and kubelet
        if: always()
        run: |
          [ -n "$SERVER_PID" ] && kill "$SERVER_PID" 2>/dev/null || true
          [ -n "$KUBELET_PID" ] && sudo kill "$KUBELET_PID" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubelet-smoke-logs-${{ matrix.k8s }}
          path: |
            ${{ env.SMOKE_TMPDIR }}/server.log
            ${{ env.SMOKE_TMPDIR }}/kubelet.log

  kcm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.8", "1.35.5", "1.36.1"]
    name: kcm ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: u7s-apiserver
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/u7s-apiserver

      - name: Add ~/bin to PATH
        run: |
          mkdir -p ~/bin
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache kubectl ${{ matrix.k8s }}
        id: cache-kubectl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/bin/kubectl
          key: kubectl-${{ matrix.k8s }}-${{ runner.arch }}

      - name: Install kubectl ${{ matrix.k8s }}
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          MINOR=$(echo "$K8S_VERSION" | cut -d. -f1-2)
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades "kubectl=$K8S_VERSION-*"
          sudo apt-mark hold kubectl
          mkdir -p ~/bin
          cp /usr/bin/kubectl ~/bin/kubectl

      - name: Start apiserver
        env:
          RUST_LOG: info
        run: |
          TMPDIR=$(mktemp -d)
          echo "SMOKE_TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          SMOKE_TOKEN="kcm-admin-token-$(date +%s)"
          echo "$SMOKE_TOKEN,kcm-admin,uid0,system:masters" > "$TMPDIR/token-auth.csv"
          ./target/release/u7s-apiserver \
            --db "$TMPDIR/state.db" \
            --kubeconfig "$TMPDIR/kubeconfig" \
            --sa-key "$TMPDIR/sa.key" \
            --sa-pub "$TMPDIR/sa.pub" \
            --ca-key "$TMPDIR/ca.key" \
            --ca-cert "$TMPDIR/ca.crt" \
            --token-auth-file "$TMPDIR/token-auth.csv" \
            --advertise-address https://127.0.0.1:6443 \
            --service-cluster-ip-range "10.96.0.0/12" \
            >"$TMPDIR/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 2>/dev/null && break
            sleep 1
          done
          nc -z 127.0.0.1 6443 2>/dev/null || { echo "Server did not start"; cat "$TMPDIR/server.log"; exit 1; }
          # Save cert-based kubeconfig before overwriting with token kubeconfig.
          cp "$TMPDIR/kubeconfig" "$TMPDIR/kubeconfig-cert"
          CA_DATA=$(grep "certificate-authority-data" "$TMPDIR/kubeconfig" | awk '{print $2}')
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    server: https://127.0.0.1:6443' \
            "    certificate-authority-data: $CA_DATA" \
            '  name: u7s' \
            'contexts:' \
            '- context:' \
            '    cluster: u7s' \
            '    user: kcm-admin' \
            '  name: u7s' \
            'current-context: u7s' \
            'users:' \
            '- name: kcm-admin' \
            '  user:' \
            "    token: $SMOKE_TOKEN" \
            > "$TMPDIR/kubeconfig"

      - name: Download kube-controller-manager
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          TMPDIR="${{ env.SMOKE_TMPDIR }}"
          curl -fsSL "https://dl.k8s.io/release/v${K8S_VERSION}/bin/linux/amd64/kube-controller-manager" \
            -o "$TMPDIR/kube-controller-manager"
          chmod +x "$TMPDIR/kube-controller-manager"

      - name: Extract CA cert and start kcm
        run: |
          TMPDIR="${{ env.SMOKE_TMPDIR }}"
          grep "certificate-authority-data" "$TMPDIR/kubeconfig-cert" | awk '{print $2}' | base64 -d > "$TMPDIR/ca.pem"
          "$TMPDIR/kube-controller-manager" \
            --kubeconfig="$TMPDIR/kubeconfig-cert" \
            --cluster-signing-cert-file="$TMPDIR/ca.pem" \
            --cluster-signing-key-file="$TMPDIR/ca.key" \
            --service-account-private-key-file="$TMPDIR/sa.key" \
            --root-ca-file="$TMPDIR/ca.pem" \
            --controllers=csrapproving,csrsigning,garbagecollector,deployment,replicaset \
            --use-service-account-credentials=false \
            --leader-elect=false \
            --bind-address=127.0.0.1 \
            --kube-api-content-type=application/json \
            >"$TMPDIR/kcm.log" 2>&1 &
          echo "KCM_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for kcm to be alive
        run: |
          TMPDIR="${{ env.SMOKE_TMPDIR }}"
          for i in $(seq 1 30); do
            kill -0 "$KCM_PID" 2>/dev/null && break
            sleep 1
          done
          kill -0 "$KCM_PID" 2>/dev/null || { echo "kcm failed to start"; cat "$TMPDIR/kcm.log"; exit 1; }

      - name: Assert kcm stays alive for 10s
        run: |
          sleep 10
          kill -0 "$KCM_PID" || { echo "kcm exited"; cat "${{ env.SMOKE_TMPDIR }}/kcm.log"; exit 1; }

      - name: Deployment → ReplicaSet → Pod (controller-manager reconciliation)
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          # Create a ConfigMap to include in the Deployment pod template volume spec.
          # This verifies the controller copies volume configuration faithfully.
          kubectl create configmap hello-config \
            --from-literal=greeting=hello \
            --namespace default

          # Create a Deployment.  No nodeName / hostNetwork needed — no kubelet in
          # this job.  The controller-manager only needs to create RS and Pod objects;
          # we do NOT assert Running/Succeeded.  sleep 5 keeps it short-lived if a
          # kubelet were ever present.
          kubectl apply --validate=false -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: hello
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: hello
            template:
              metadata:
                labels:
                  app: hello
              spec:
                containers:
                  - name: hello
                    image: busybox:1.36
                    command: ["sleep", "5"]
                    volumeMounts:
                      - name: config-vol
                        mountPath: /etc/config
                volumes:
                  - name: config-vol
                    configMap:
                      name: hello-config
          EOF

          # Assert ReplicaSet was created by the deployment controller.
          RS_FOUND=0
          for i in $(seq 1 60); do
            RS_COUNT=$(kubectl get rs -l app=hello -n default \
              --no-headers 2>/dev/null | wc -l | tr -d ' ')
            if [ "$RS_COUNT" -ge 1 ]; then
              RS_FOUND=1
              break
            fi
            sleep 1
          done
          if [ "$RS_FOUND" -eq 0 ]; then
            echo "ERROR: No ReplicaSet created for Deployment hello within 60s"
            kubectl get rs -n default || true
            tail -50 "${{ env.SMOKE_TMPDIR }}/kcm.log"
            tail -50 "${{ env.SMOKE_TMPDIR }}/server.log"
            exit 1
          fi
          echo "ReplicaSet created:"
          kubectl get rs -l app=hello -n default

          # Assert Pod object was created by the replicaset controller.
          POD_FOUND=0
          for i in $(seq 1 60); do
            POD_COUNT=$(kubectl get pod -l app=hello -n default \
              --no-headers 2>/dev/null | wc -l | tr -d ' ')
            if [ "$POD_COUNT" -ge 1 ]; then
              POD_FOUND=1
              break
            fi
            sleep 1
          done
          if [ "$POD_FOUND" -eq 0 ]; then
            echo "ERROR: No Pod created for Deployment hello within 60s"
            kubectl get pod -n default || true
            tail -50 "${{ env.SMOKE_TMPDIR }}/kcm.log"
            tail -50 "${{ env.SMOKE_TMPDIR }}/server.log"
            exit 1
          fi
          echo "Pod created:"
          kubectl get pod -l app=hello -n default

          # Assert the Pod carries the expected label (proves it came from our
          # Deployment template, not some stray object).
          APP_LABEL=$(kubectl get pod -l app=hello -n default \
            -o jsonpath='{.items[0].metadata.labels.app}' 2>/dev/null || true)
          if [ "$APP_LABEL" != "hello" ]; then
            echo "ERROR: Pod missing expected label app=hello (got: $APP_LABEL)"
            exit 1
          fi

          # Clean up.
          kubectl delete deployment hello --namespace default
          kubectl delete configmap hello-config --namespace default

      - name: Stop u7s and kcm
        if: always()
        run: |
          [ -n "$KCM_PID" ] && kill "$KCM_PID" 2>/dev/null || true
          [ -n "$SERVER_PID" ] && kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kcm-smoke-logs-${{ matrix.k8s }}
          path: |
            ${{ env.SMOKE_TMPDIR }}/kcm.log
            ${{ env.SMOKE_TMPDIR }}/server.log
