name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  smoke:
    # Only run on main branch pushes — keep PR CI fast.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p u7s-apiserver

      - name: Install kubectl
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl

      - name: Start apiserver
        run: |
          TMPDIR=$(mktemp -d)
          echo "SMOKE_TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          ./target/release/u7s-apiserver \
            --db "$TMPDIR/state.db" \
            --kubeconfig "$TMPDIR/kubeconfig" \
            --sa-key "$TMPDIR/sa.key" \
            --sa-pub "$TMPDIR/sa.pub" \
            --advertise-address https://127.0.0.1:6443 \
            >"$TMPDIR/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait until the server logs "listening on" (up to 30 s)
          for i in $(seq 1 30); do
            grep -q "listening on" "$TMPDIR/server.log" 2>/dev/null && break
            sleep 1
          done
          grep -q "listening on" "$TMPDIR/server.log" || { echo "Server did not start"; cat "$TMPDIR/server.log"; exit 1; }

      - name: Smoke — namespace CRUD
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl create namespace smoke-test
          kubectl get namespace smoke-test
          kubectl get namespaces | grep smoke-test

      - name: Smoke — ConfigMap CRUD
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl create configmap smoke-cm --from-literal=key=value --namespace smoke-test
          kubectl get configmap smoke-cm --namespace smoke-test
          kubectl get configmaps --namespace smoke-test | grep smoke-cm

      - name: Smoke — CRD create and get
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: foos.smoke.u7s.dev
          spec:
            group: smoke.u7s.dev
            names:
              kind: Foo
              plural: foos
              singular: foo
            scope: Cluster
            versions:
              - name: v1alpha1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    type: object
                    properties:
                      spec:
                        type: object
          EOF
          kubectl get crd foos.smoke.u7s.dev

      - name: Smoke — CR instance create and get
        env:
          KUBECONFIG: ${{ env.SMOKE_TMPDIR }}/kubeconfig
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: smoke.u7s.dev/v1alpha1
          kind: Foo
          metadata:
            name: smoke-foo
          spec: {}
          EOF
          kubectl get foo smoke-foo

      - name: Stop apiserver
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: ${{ env.SMOKE_TMPDIR }}/server.log
