name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build and publish (e.g. v0.1.0-SNAPSHOT.1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A partially-uploaded GitHub Release is worse than a slow one -- never
  # cancel a run mid-publish.
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version and release kind
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          case "$V" in
            v*-*) PRERELEASE=true
              ;;
            v*) PRERELEASE=false
              ;;
            *)
              echo "error: version must start with 'v' (got: '$V')" >&2
              exit 1
              ;;
          esac
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build tarball
        run: scripts/build-release-tarball.sh "${{ steps.version.outputs.v }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.v }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          prerelease_flag=""
          [ "$PRERELEASE" = "true" ] && prerelease_flag="--prerelease"
          gh release create "$VERSION" dist/*.tar.gz \
            --title "$VERSION" \
            --notes "u7s release tarball for $VERSION: u7s-apiserver, u7s-scheduler, kubelet, and kube-controller-manager for linux/amd64" \
            $prerelease_flag
