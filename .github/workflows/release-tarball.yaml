name: Release tarball

# Interim distribution mechanism (mayor-j19o1): builds the four-binary
# release tarball scripts/install.sh expects and publishes it as a GitHub
# Release artifact. This is explicitly NOT the final distribution-hosting
# answer -- GitHub cannot be the real curl|sh origin (no IPv6, see
# ai/findings/mayor-233bh-packaging-distribution-sketch-2026-08-20.md §7) --
# it exists so the build pipeline itself can be validated end to end while
# that separate question stays open.
#
# x86_64 only for now (operator direction, YAGNI-first) -- aarch64 is
# deliberately deferred until there's real demand, not designed around
# speculatively.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build and publish (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A partially-uploaded GitHub Release is worse than a slow one -- never
  # cancel a run mid-publish.
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version and release kind
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "v=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            # workflow_dispatch exists to validate this pipeline without a
            # real tag -- mark it prerelease so it's never mistaken for a
            # real, supported release.
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build tarball
        run: scripts/build-release-tarball.sh "${{ steps.version.outputs.v }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.v }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          ls -la dist
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz --clobber
          else
            # --generate-notes diffs against the previous release tag; with
            # none yet (this repo's first release), it falls back to the
            # entire commit history and trips GitHub's 125000-char release-
            # body limit (HTTP 422, confirmed live). A short static note
            # sidesteps that regardless of how much history has accumulated.
            prerelease_flag=""
            [ "$PRERELEASE" = "true" ] && prerelease_flag="--prerelease"
            gh release create "$VERSION" dist/*.tar.gz \
              --title "$VERSION" \
              --notes "u7s release tarball for $VERSION: u7s-apiserver, u7s-scheduler, kubelet, and kube-controller-manager for linux/amd64. Interim GitHub Release hosting -- see ai/findings/mayor-233bh-packaging-distribution-sketch-2026-08-20.md §7 for the still-open real distribution-hosting question." \
              $prerelease_flag
          fi
