name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build and publish (e.g. v0.1.0-SNAPSHOT.1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A partially-uploaded GitHub Release is worse than a slow one -- never
  # cancel a run mid-publish.
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

# The build job runs every dependency's build.rs and proc-macros, so it gets a
# read-only token that is not persisted in .git/config and restores no cache.
# Only the publish job holds contents: write, and it runs no repo code or cargo.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.v }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tarball: ${{ steps.digest.outputs.tarball }}
      tarball_sha256: ${{ steps.digest.outputs.tarball_sha256 }}
      install_sha256: ${{ steps.digest.outputs.install_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Determine version and release kind
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9A-Za-z.-]+$'; then
            echo "error: version must match [0-9A-Za-z.-] (letters, digits, '.' and '-' only; '+' is rejected; got: '$V')" >&2
            exit 1
          fi
          case "$V" in
            v*-*) PRERELEASE=true
              ;;
            v*) PRERELEASE=false
              ;;
            *)
              echo "error: version must start with 'v' (got: '$V')" >&2
              exit 1
              ;;
          esac
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # No rust-cache: a cache restored from main-branch CI would feed
      # attacker-controlled build output into the release.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Build tarball
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: scripts/build-release-tarball.sh "$VERSION"

      - name: Compute checksum sidecar
        # install.sh's fetch_tarball() hard-fails a download whose bytes
        # don't match this sidecar -- raw hex, no filename, so it compares
        # byte-for-byte against `sha256sum | cut -d' ' -f1`.
        run: |
          set -- dist/*.tar.gz
          if [ $# -ne 1 ]; then
            echo "error: expected exactly one tarball in dist/, found $#" >&2
            exit 1
          fi
          sha256sum "$1" | cut -d' ' -f1 > "$1.sha256"

      - name: Bake the release tarball URL into install.sh
        # A script piped into `bash` cannot discover the URL it was fetched from,
        # so the published copy carries it as a literal. Baked here because the
        # distribution host is a deployment concern, not a build input
        env:
          VERSION: ${{ steps.version.outputs.v }}
          DIST_BASE_URL: ${{ vars.U7S_DIST_BASE_URL }}
        run: |
          if [ -z "$DIST_BASE_URL" ]; then
            echo "error: repository variable U7S_DIST_BASE_URL is unset -- set it to the" >&2
            echo "       distribution proxy's base URL (deploy/get-u7s/), e.g. https://get.u7s.example" >&2
            exit 1
          fi
          set -- dist/*.tar.gz
          if [ $# -ne 1 ]; then
            echo "error: expected exactly one tarball in dist/, found $#" >&2
            exit 1
          fi
          url="${DIST_BASE_URL%/}/$VERSION/$(basename "$1")"
          sed "s|^DEFAULT_TARBALL_URL=\"\"$|DEFAULT_TARBALL_URL=\"$url\"|" \
            scripts/install.sh > dist/install.sh
          # A no-op sed exits 0 and would publish a script that tells users it
          # came from a git checkout, so assert the substitution took effect.
          if ! grep -qxF "DEFAULT_TARBALL_URL=\"$url\"" dist/install.sh; then
            echo "error: failed to bake DEFAULT_TARBALL_URL into install.sh -- has the" >&2
            echo "       'DEFAULT_TARBALL_URL=\"\"' line in scripts/install.sh been renamed?" >&2
            exit 1
          fi
          chmod +x dist/install.sh
          echo "baked: $url"

      - name: Record digests for the publish job
        id: digest
        run: |
          set -- dist/*.tar.gz
          {
            echo "tarball=$(basename "$1")"
            echo "tarball_sha256=$(sha256sum "$1" | cut -d' ' -f1)"
            echo "install_sha256=$(sha256sum dist/install.sh | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected Environment (required reviewers) holding RELEASE_SIGNING_KEY:
    # nothing is signed or published without a manual approval.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/

      - name: Verify artifact against the build job's digests
        # Digests travel as job outputs, a different channel from the artifact,
        # so a tampered or truncated artifact fails here.
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          INSTALL_SHA256: ${{ needs.build.outputs.install_sha256 }}
        run: |
          cd dist
          printf '%s  %s\n' "$TARBALL_SHA256" "$TARBALL" "$INSTALL_SHA256" install.sh | sha256sum -c -
          [ "$(cat "$TARBALL.sha256")" = "$TARBALL_SHA256" ]
          [ "$(find . -type f | wc -l)" -eq 3 ]

      - name: Sign tarball, checksum and install.sh with Ed25519
        # install.sh verifies the tarball signatures against the key embedded in
        # the script; users verify install.sh.sig by hand against the README key.
        # Fails if that key is unset or is not the public half of the signing
        # key, so a release no installer could verify is never published.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "error: RELEASE_SIGNING_KEY is not set in the 'release' Environment" >&2; exit 1; }
          openssl version
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keydir/priv.pem")
          openssl pkey -in "$keydir/priv.pem" -pubout -out "$keydir/pub.pem"
          if ! grep -qx 'RELEASE_PUBKEY_PEM="-----BEGIN PUBLIC KEY-----' dist/install.sh; then
            echo "error: install.sh has no embedded RELEASE_PUBKEY_PEM -- paste the public key before releasing" >&2
            exit 1
          fi
          embedded="$(awk '/^RELEASE_PUBKEY_PEM="-----BEGIN PUBLIC KEY-----$/{f=1} f{print} /-----END PUBLIC KEY-----"$/{f=0}' dist/install.sh)"
          embedded="${embedded#RELEASE_PUBKEY_PEM=\"}"
          embedded="${embedded%\"}"
          if [ "$embedded" != "$(cat "$keydir/pub.pem")" ]; then
            echo "error: install.sh's embedded public key does not match RELEASE_SIGNING_KEY" >&2
            exit 1
          fi
          cd dist
          for f in *.tar.gz *.tar.gz.sha256 install.sh; do
            openssl pkeyutl -sign -rawin -inkey "$keydir/priv.pem" -in "$f" -out "$f.sig"
            openssl pkeyutl -verify -pubin -inkey "$keydir/pub.pem" -rawin -in "$f" -sigfile "$f.sig"
          done

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          prerelease_flag=""
          [ "$PRERELEASE" = "true" ] && prerelease_flag="--prerelease"
          # See docs/decisions/distribution-hosting-shape.md.
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "u7s $VERSION for linux/amd64: u7s-apiserver, u7s-scheduler, kubelet, and kube-controller-manager, plus the matching install.sh" \
            $prerelease_flag
