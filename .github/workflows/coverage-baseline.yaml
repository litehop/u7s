name: Update coverage baseline

on:
  schedule:
    - cron: '17 8 * * *'

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Measure coverage
        run: |
          COVERAGE=$(cargo llvm-cov --workspace --summary-only --json \
            | jq '.data[0].totals.lines.percent')
          THRESHOLD=$(echo "$COVERAGE - 5" | bc | cut -d. -f1)
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          echo "THRESHOLD=$THRESHOLD" >> "$GITHUB_ENV"

      - name: Update threshold in test.yaml
        run: |
          CURRENT=$(grep -o '\-\-fail-under-lines [0-9]*' .github/workflows/test.yaml \
            | grep -o '[0-9]*')
          if [ "$THRESHOLD" != "$CURRENT" ]; then
            sed -i "s/--fail-under-lines [0-9]*/--fail-under-lines $THRESHOLD/" \
              .github/workflows/test.yaml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/test.yaml
            git commit -m "ci(coverage): update threshold to $THRESHOLD (was $CURRENT, coverage $COVERAGE%) [skip ci]"
            git push
          else
            echo "Threshold unchanged at $THRESHOLD — no commit needed"
          fi
