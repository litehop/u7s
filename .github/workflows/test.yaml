name: Test

on:
  push:
    branches-ignore:
      # merge_group below already covers queue branches; without this,
      # push and merge_group both fire on the same queue ref and race in
      # the shared concurrency group, cancelling the merge_group run.
      - 'gh-readonly-queue/**'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings

      # Untrusted-hook-bypass defense for .githooks/pre-commit's own bead-ID
      # check: a pusher can skip local hooks, so CI is the backstop that
      # actually enforces it.
      - name: Bead-ID references
        run: scripts/check-bead-id-refs.sh

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --check

  # Regression guards for scripts/**/test-*-logic.sh (plus the standalone
  # test-critical-reviewer-hook.sh, test-install-checksum.sh,
  # test-release-tarball-licenses.sh, and test-add-node-warning.sh) --
  # pure-bash unit tests for shell-script logic (argument parsing, decision
  # functions, process supervision), none of which touch a real Lima
  # VM/kubectl/sonobuoy. Discovered via `find` so new sibling scripts are
  # picked up automatically instead of silently staying untested like this
  # whole family did before.
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Some discovered test-*-logic.sh invoke cargo (e.g.
      # test-release-tarball-licenses.sh, scripts/conformance/test-dhat-depth-
      # logic.sh, test-profile-flag-logic.sh) -- needs cargo on PATH.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run scripts/**/test-*-logic.sh + test-critical-reviewer-hook.sh + test-install-checksum.sh + test-release-tarball-licenses.sh + test-add-node-warning.sh
        run: |
          tests_file="$(mktemp)"
          find scripts -type f \( -name 'test-*-logic.sh' -o -name 'test-critical-reviewer-hook.sh' -o -name 'test-install-checksum.sh' -o -name 'test-release-tarball-licenses.sh' -o -name 'test-add-node-warning.sh' \) | sort > "$tests_file"
          count=$(wc -l < "$tests_file")
          if [ "$count" -eq 0 ]; then
            echo "no scripts/**/test-*-logic.sh regression scripts found — discovery is broken" >&2
            exit 1
          fi
          echo "found $count regression-guard scripts"
          fail=0
          while IFS= read -r t; do
            echo "--- $t ---"
            bash "$t" || fail=1
          done < "$tests_file"
          rm -f "$tests_file"
          exit "$fail"

  # runs the whole suite _and_ checks coverage too
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage
        run: cargo llvm-cov --locked --workspace --summary-only --fail-under-lines 90

  # Real-binary leaf rotation: an apiserver built with the test-only pki-test-knobs feature
  # issues its serving cert with a 60s lifetime; the script asserts the cert is renewed and
  # hot-swapped before expiry while a watch and fresh kubectl requests keep working. Runs the
  # apiserver alone (no kubelet/KCM/scheduler on the runner); the node-side checks run through
  # scripts/conformance/run-all.sh --pki-test-lifetime on the Lima fleet.
  pki-rotation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build apiserver with pki-test-knobs and the scheduler
        run: cargo build --locked --release -p u7s-apiserver --features pki-test-knobs && cargo build --locked --release -p u7s-scheduler

      - name: Start apiserver with 120s test lifetimes
        env:
          U7S_PKI_TEST_LIFETIME_SECS: "120"
          U7S_PKI_TEST_SA_ROTATION_SECS: "120"
          # 4.5x the leaf lifetime so the leaves it signs are never clamped (and the renewal point of a
          # clamped leaf never lands in the past); rotates at 360s and then every 360s.
          U7S_PKI_TEST_INTERMEDIATE_LIFETIME_SECS: "540"
        run: |
          W="$PWD/temp/pki-e2e"
          mkdir -p "$W/manifests"
          ./target/release/u7s-apiserver \
            --db "$W/state.db" --listen 127.0.0.1:6443 --kubeconfig "$W/kubeconfig" \
            --sa-key "$W/sa.key" --sa-pub "$W/sa.pub" \
            --ca-key "$W/ca.key" --ca-cert "$W/ca.crt" \
            --proxy-client-ca-key "$W/proxy-client-ca.key" --proxy-client-ca-cert "$W/proxy-client-ca.crt" \
            --advertise-address https://127.0.0.1:6443 \
            --manifest-dir "$W/manifests" >"$W/apiserver.log" 2>&1 &
          for _ in $(seq 1 30); do
            nc -z 127.0.0.1 6443 2>/dev/null && exit 0
            sleep 1
          done
          cat "$W/apiserver.log"
          exit 1

      - name: Start standalone scheduler on the apiserver's file-path kubeconfig
        run: |
          W="$PWD/temp/pki-e2e"
          ./target/release/u7s-scheduler --kubeconfig "$W/kubeconfig-scheduler" >"$W/scheduler.log" 2>&1 &
          sleep 2
          pgrep -f "u7s-scheduler.*$W/kubeconfig" >/dev/null || { cat "$W/scheduler.log"; exit 1; }

      - name: PKI rotation e2e helper logic
        run: |
          scripts/e2e-pki-rotation/test-leaf-rotation-logic.sh
          scripts/e2e-pki-rotation/test-intermediate-rotation-logic.sh

      - name: Intermediate rotation e2e
        run: |
          scripts/e2e-pki-rotation/intermediate-rotation.sh \
            --kubeconfig temp/pki-e2e/kubeconfig --workdir temp/pki-e2e --port 6443 \
            --scheduler --intermediate-lifetime 540

      - name: Leaf rotation e2e (3 iterations)
        run: |
          scripts/e2e-pki-rotation/leaf-rotation.sh \
            --kubeconfig temp/pki-e2e/kubeconfig --workdir temp/pki-e2e --port 6443 --iterations 3 \
            --scheduler --lifetime 120

      - name: CA bundle tolerance e2e
        run: |
          scripts/e2e-pki-rotation/ca-bundle.sh \
            --kubeconfig temp/pki-e2e/kubeconfig --workdir temp/pki-e2e --port 6443

      - name: SA signing-key rotation e2e (2 rotations)
        run: |
          scripts/e2e-pki-rotation/sa-key-rotation.sh \
            --kubeconfig temp/pki-e2e/kubeconfig --workdir temp/pki-e2e --rotation 120 --iterations 2

      - name: Upload apiserver log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pki-rotation-e2e-logs
          path: |
            temp/pki-e2e/apiserver.log
            temp/pki-e2e/scheduler.log
          retention-days: 7
