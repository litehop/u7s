name: Test

on:
  push:
    branches-ignore:
      # merge_group below already covers queue branches; without this,
      # push and merge_group both fire on the same queue ref and race in
      # the shared concurrency group, cancelling the merge_group run.
      - 'gh-readonly-queue/**'
      # The queue already tested this exact SHA; cache-prime.yaml re-runs these jobs on main
      # only when a rust-cache key can change.
      - main
  merge_group:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings

      # Test-only cfg paths (rig loopback allowance, shortened PKI lifetimes) never compile
      # under default features.
      - name: Clippy (test-knob features)
        run: >-
          cargo clippy --locked -p u7s-apiserver --tests --no-deps
          --features rig-test-knobs,pki-test-knobs -- -D warnings

      # Untrusted-hook-bypass defense for .githooks/pre-commit's own bead-ID
      # check: a pusher can skip local hooks, so CI is the backstop that
      # actually enforces it.
      - name: Bead-ID references
        run: scripts/check-bead-id-refs.sh

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Format check
        run: cargo fmt --check

  # Regression guards for scripts/**/test-*-logic.sh (plus the standalone
  # test-critical-reviewer-hook.sh, test-install-checksum.sh,
  # test-release-tarball-licenses.sh, and test-add-node-warning.sh) --
  # pure-bash unit tests for shell-script logic (argument parsing, decision
  # functions, process supervision), none of which touch a real Lima
  # VM/kubectl/sonobuoy. Discovered via `find` so new sibling scripts are
  # picked up automatically instead of silently staying untested like this
  # whole family did before.
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No scripts here compile anything, so no Rust toolchain or cache. Scripts run in
      # parallel (see scripts/run-script-tests.sh); each must use its own mktemp -d.
      - name: Run scripts/**/test-*-logic.sh + test-critical-reviewer-hook.sh + test-install-checksum.sh + test-release-tarball-licenses.sh + test-add-node-warning.sh
        run: scripts/run-script-tests.sh

  # runs the whole suite _and_ checks coverage too
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage
        run: cargo llvm-cov --locked --workspace --summary-only --fail-under-lines 90

  # Runs the feature-gated tests that default-feature jobs never compile. Separate job so it
  # runs parallel to test-coverage; not a required check unless the ruleset adds it.
  # Debuginfo off: it is never read here and dominates compile time.
  feature-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Only the node-proxy tests are feature-sensitive; the rest of the suite already runs
      # in test-coverage. Clippy with the features runs in the lint job.
      - name: Tests (test-knob features)
        run: >-
          cargo test --locked -p u7s-apiserver --lib
          --features rig-test-knobs,pki-test-knobs -- node_proxy

  # Optimised frames are what production runs, so the depth limits' guarantee
  # (accepted at create => evaluates at runtime) is only checkable here. Fat LTO with one
  # codegen unit takes over 15 minutes cold on a runner, so the profile is relaxed to
  # opt-level 3 without LTO; the limits keep 45% headroom over measured fat-LTO depths.
  # Not a required check.
  release-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # save-if: only main writes the shared cache; branches restore it read-only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Depth invariants (release)
        run: >-
          cargo test --locked --release
          --config 'profile.release.lto="off"' --config profile.release.codegen-units=16
          -p u7s-apiserver -- evaluates_in_release every_crd_shape
