name: e2e-focus-run
description: >-
  Install a single-node u7s cluster on a plain ubuntu runner by running the
  checkout's real scripts/install.sh against the build job's binaries, then run
  one sonobuoy --e2e-focus pass against it, asserting an exact spec count.
  Shared by the baseline e2e-focus job and the sensitive-e2e-guard job so both
  exercise the identical install.
inputs:
  k8s_version:
    description: Kubernetes version for kubelet/kubectl/KCM + the conformance image, e.g. 1.37.1.
    required: true
  focus:
    description: ginkgo --e2e-focus regex passed to sonobuoy.
    required: true
  expected_specs:
    description: Exact number of specs the focus must run (asserted against ginkgo's "Ran N of" line).
    required: true
  run_label:
    description: Distinguishes this run's uploaded log artifact from other callers in the same workflow run (name is "<run_label>-logs-<k8s_version>").
    required: true
runs:
  using: composite
  steps:
    - name: Download binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: u7s-e2e-focus-binaries
        path: target/release
    - name: Make binaries executable
      shell: bash
      run: chmod +x target/release/u7s-apiserver target/release/u7s-scheduler

    - name: Add ~/bin to PATH
      shell: bash
      run: |
        mkdir -p ~/bin
        echo "$HOME/bin" >> "$GITHUB_PATH"

    - name: Restore Kubernetes binaries cache ${{ inputs.k8s_version }}
      id: cache-k8s-bins
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/k8s-bins
        key: k8s-bins-${{ inputs.k8s_version }}-amd64

    - name: Fetch Kubernetes binaries ${{ inputs.k8s_version }}
      # kube-proxy is not fetched: install.sh runs it as a DaemonSet from
      # manifests/kube-proxy.yaml, not as a host binary. No cosign in CI, so
      # the dl.k8s.io .sha256 sidecar is the check; a failed fetch exits before
      # the cache save below, so a bad download is never cached.
      if: steps.cache-k8s-bins.outputs.cache-hit != 'true'
      env:
        K8S_VERSION: ${{ inputs.k8s_version }}
      shell: bash
      run: |
        . scripts/lib/release-fetch.sh
        mkdir -p ~/k8s-bins
        for bin in kubelet kube-controller-manager kubectl; do
          url="https://dl.k8s.io/release/v${K8S_VERSION}/bin/linux/amd64/${bin}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-connrefused -o "$HOME/k8s-bins/$bin" "$url"
          expected="$(curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-connrefused "${url}.sha256")"
          actual="$(sha256_of "$HOME/k8s-bins/$bin")"
          if [ "$expected" != "$actual" ]; then
            echo "error: checksum mismatch for $bin: expected $expected, got $actual" >&2
            exit 1
          fi
          chmod +x "$HOME/k8s-bins/$bin"
          echo "$bin: sha256 $actual verified"
        done

    - name: Save Kubernetes binaries cache
      if: steps.cache-k8s-bins.outputs.cache-hit != 'true' && success()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/k8s-bins
        key: k8s-bins-${{ inputs.k8s_version }}-amd64

    - name: Resolve pinned CNI plugins version
      id: cni-version
      env:
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      shell: bash
      run: |
        . scripts/lib/release-fetch.sh
        case "$RUNNER_ARCH_NAME" in
          X64) arch=amd64; sha="$CNI_PLUGINS_SHA256_AMD64" ;;
          ARM64) arch=arm64; sha="$CNI_PLUGINS_SHA256_ARM64" ;;
          *) echo "error: unsupported runner arch $RUNNER_ARCH_NAME" >&2; exit 1 ;;
        esac
        {
          echo "version=$CNI_PLUGINS_VERSION"
          echo "arch=$arch"
          echo "sha256=$sha"
        } >> "$GITHUB_OUTPUT"

    - name: Cache CNI plugins
      id: cache-cni
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/cni-plugins
        key: cni-plugins-${{ steps.cni-version.outputs.version }}-${{ steps.cni-version.outputs.arch }}-${{ steps.cni-version.outputs.sha256 }}

    - name: Fetch CNI plugins
      # The tarball is sha256-pinned in scripts/lib/release-fetch.sh and comes
      # from github.com, not packages.microsoft.com (which 429s CI runners).
      if: steps.cache-cni.outputs.cache-hit != 'true'
      shell: bash
      env:
        CNI_ARCH: ${{ steps.cni-version.outputs.arch }}
      run: |
        for attempt in 1 2 3; do
          if (. scripts/lib/release-fetch.sh && fetch_cni_plugins_for_arch "$HOME/cni-plugins" "$CNI_ARCH"); then
            exit 0
          fi
          echo "CNI plugins fetch attempt $attempt failed" >&2
          sleep $((attempt * 10))
        done
        exit 1

    - name: Cache sonobuoy CLI
      id: cache-sonobuoy
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/bin/sonobuoy
        key: sonobuoy-0.57.3-${{ runner.arch }}

    - name: Install sonobuoy CLI
      if: steps.cache-sonobuoy.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/bin
        curl -fsSL "https://github.com/vmware-tanzu/sonobuoy/releases/download/v0.57.3/sonobuoy_0.57.3_linux_amd64.tar.gz" \
          | tar -xz -C ~/bin sonobuoy
        chmod +x ~/bin/sonobuoy

    - name: Install skopeo
      shell: bash
      run: sudo apt-get install -y skopeo

    - name: Restore conformance image cache
      id: cache-conformance-image
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/conformance-image-${{ inputs.k8s_version }}.tar
        key: conformance-image-${{ inputs.k8s_version }}-${{ runner.arch }}

    - name: Pull conformance image to archive
      # A failed pull must never populate the cache below -- per the
      # postmortem, caching a failed/partial pull would make the
      # registry.k8s.io CDN-staleness failure deterministic forever
      # instead of self-healing on the next run.
      if: steps.cache-conformance-image.outputs.cache-hit != 'true'
      shell: bash
      run: |
        skopeo copy \
          "docker://registry.k8s.io/conformance:v${{ inputs.k8s_version }}" \
          "docker-archive:/tmp/conformance-image-${{ inputs.k8s_version }}.tar:registry.k8s.io/conformance:v${{ inputs.k8s_version }}"

    - name: Save conformance image cache
      if: steps.cache-conformance-image.outputs.cache-hit != 'true' && success()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/conformance-image-${{ inputs.k8s_version }}.tar
        key: conformance-image-${{ inputs.k8s_version }}-${{ runner.arch }}

    - name: Resolve install.sh's pinned cri-o version
      id: crio-version
      shell: bash
      run: |
        v="$(sed -n 's/^CRIO_VERSION="\(.*\)"$/\1/p' scripts/install.sh)"
        [ -n "$v" ] || { echo "error: CRIO_VERSION not found in scripts/install.sh" >&2; exit 1; }
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Restore cri-o .deb cache
      id: cache-crio
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/crio-debs
        key: crio-debs-${{ steps.crio-version.outputs.version }}-${{ runner.arch }}

    - name: Pre-seed apt archive with cached cri-o .debs
      # install.sh's own `apt-get install cri-o=<pin>` then finds each .deb
      # (matching the repo index's size and hash) in apt's archive and
      # downloads nothing from the OBS mirror; only the small index fetch remains.
      if: steps.cache-crio.outputs.cache-hit == 'true'
      shell: bash
      run: sudo cp "$HOME"/crio-debs/*.deb /var/cache/apt/archives/

    - name: Rig-only prerequisites
      # Everything the CI node does that install.sh does not, recorded in
      # run-meta (topology=install). Docker, pre-installed and running on the
      # runner, sets the iptables FORWARD policy to DROP and opens it only for
      # its own bridges, so direct pod-to-pod traffic over cni0 (e.g.
      # sonobuoy's worker reporting to the aggregator) times out.
      shell: bash
      run: |
        echo "runner kernel: $(uname -r)"
        sudo iptables -P FORWARD ACCEPT
        mkdir -p temp/u7s
        {
          echo "topology=install"
          echo "k8s_version=${{ inputs.k8s_version }}"
          echo "kernel=$(uname -r)"
          echo "rig_only_setup=iptables-forward-accept,conformance-image-preload"
        } | tee temp/u7s/run-meta >> "$GITHUB_STEP_SUMMARY"

    - name: Assemble install tree
      # install.sh finds each binary by name anywhere in this tree; the layout
      # mirrors build-release-tarball.sh. The u7s binaries are the build job's
      # artifact, the rest come from the sha-verified caches above.
      shell: bash
      run: |
        TREE="$RUNNER_TEMP/u7s-tree"
        mkdir -p "$TREE/cni-plugins" "$TREE/manifests"
        cp target/release/u7s-apiserver target/release/u7s-scheduler "$TREE/"
        cp "$HOME"/k8s-bins/* "$TREE/"
        cp "$HOME"/cni-plugins/* "$TREE/cni-plugins/"
        cp manifests/*.yaml "$TREE/manifests/"
        echo "U7S_TREE=$TREE" >> "$GITHUB_ENV"

    - name: Run scripts/install.sh
      shell: bash
      run: sudo scripts/install.sh --tarball-dir "$U7S_TREE"

    - name: Collect cri-o .debs for the cache
      if: steps.cache-crio.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/crio-debs
        cp /var/cache/apt/archives/cri-o_*.deb /var/cache/apt/archives/crun_*.deb /var/cache/apt/archives/conmon_*.deb ~/crio-debs/
        ls -l ~/crio-debs

    - name: Save cri-o .deb cache
      if: steps.cache-crio.outputs.cache-hit != 'true' && success()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/crio-debs
        key: crio-debs-${{ steps.crio-version.outputs.version }}-${{ runner.arch }}

    - name: Expose admin kubeconfig
      shell: bash
      run: |
        sudo kubectl --kubeconfig=/var/lib/u7s/kubeconfig config view --raw --flatten > temp/u7s/kubeconfig
        chmod 600 temp/u7s/kubeconfig
        KUBECONFIG="$PWD/temp/u7s/kubeconfig" kubectl get nodes -o wide

    - name: Load conformance image into cri-o storage
      # Writes straight into the containers/storage graph cri-o's image
      # service reads from (same mechanism as `podman load`), so the
      # sonobuoy e2e-job pod's image pull is answered from local storage
      # and cri-o never touches registry.k8s.io for it -- this is what
      # actually avoids the CDN-staleness pulls, not just the archive
      # cache above.
      shell: bash
      run: |
        sudo skopeo copy \
          "docker-archive:/tmp/conformance-image-${{ inputs.k8s_version }}.tar" \
          "containers-storage:registry.k8s.io/conformance:v${{ inputs.k8s_version }}"

    - name: Sample baseline RSS
      shell: bash
      run: |
        sleep 5
        APISERVER_PID=$(systemctl show -p MainPID --value u7s-apiserver)
        APISERVER_RSS=$(ps -o rss= -p "$APISERVER_PID" | tr -d ' ')
        echo "BASELINE_APISERVER_RSS_KB=$APISERVER_RSS" >> "$GITHUB_ENV"
        read -r MEM_TOTAL MEM_USED MEM_FREE <<< "$(free -m | awk '/^Mem:/{print $2, $3, $4}')"
        {
          echo "### RSS baseline (k8s ${{ inputs.k8s_version }}, before sonobuoy)"
          echo "- apiserver RSS (scheduler embedded): ${APISERVER_RSS} kB (threshold: 65536 kB)"
          echo "- runner memory (free -m): total=${MEM_TOTAL}MB used=${MEM_USED}MB free=${MEM_FREE}MB"
        } | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$APISERVER_RSS" -gt 65536 ]; then
          echo "FAIL: baseline apiserver RSS ${APISERVER_RSS} kB exceeds 65536 kB (64 MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Pre-seed sonobuoy namespace
      env:
        KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
      shell: bash
      run: |
        kubectl create namespace sonobuoy --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f scripts/conformance/sonobuoy-namespace-limitrange.yaml

    - name: Run sonobuoy (--e2e-focus)
      env:
        KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
        FOCUS: ${{ inputs.focus }}
      shell: bash
      run: |
        # scripts/conformance/sonobuoy-plugin-e2e.yaml hardcodes the
        # plugin's image field at a specific v1.37.1 tag (it's a static
        # manifest -- sonobuoy loads it verbatim, not per-cluster the way
        # its own --kubernetes-version=auto default does). Without this
        # CLI-level override every matrix branch would run the same fixed
        # v1.37.1 e2e binaries against its own matrix-selected kubelet --
        # burying real per-version issues. --kube-conformance-image
        # overrides just the image tag on the plugin (shorthand for
        # --plugin-image=e2e:<image>) without touching the manifest.
        sonobuoy run \
          -p scripts/conformance/sonobuoy-plugin-e2e.yaml \
          --kube-conformance-image="registry.k8s.io/conformance:v${{ inputs.k8s_version }}" \
          --wait \
          --skip-preflight=existingnamespace \
          --kubeconfig "$KUBECONFIG" \
          --e2e-focus="$FOCUS" &
        SONOBUOY_PID=$!

        # 5-minute wall-clock bound on the sonobuoy run. Composite-action
        # steps do NOT honour step-level timeout-minutes (actions/runner#1979),
        # so the fail-fast-on-hang budget the job-step version relied on is
        # enforced here in the poll loop instead -- otherwise a hang would run
        # to the caller job's full timeout-minutes.
        DEADLINE=$(( SECONDS + 300 ))
        # Watchdog: an image-pull failure otherwise burns the full deadline
        # before failing, and the real registry error only ever surfaces via
        # `kubectl describe pod` (see the postmortem) -- poll for it and fail
        # immediately with that error instead of waiting the deadline out.
        while kill -0 "$SONOBUOY_PID" 2>/dev/null; do
          if [ "$SECONDS" -ge "$DEADLINE" ]; then
            echo "ERROR: sonobuoy did not finish within 5 minutes -- killing (hang)" >&2
            kill "$SONOBUOY_PID" 2>/dev/null || true
            exit 1
          fi
          REASON=$(kubectl get pods -n sonobuoy -l sonobuoy-component=plugin \
            -o jsonpath='{.items[0].status.containerStatuses[*].state.waiting.reason}' 2>/dev/null || true)
          case "$REASON" in
            *ImagePullBackOff*|*ErrImagePull*)
              echo "ERROR: conformance image pull failed (reason: $REASON)" >&2
              kubectl describe pods -n sonobuoy -l sonobuoy-component=plugin >&2 || true
              kill "$SONOBUOY_PID" 2>/dev/null || true
              exit 1
              ;;
          esac
          sleep 5
        done
        wait "$SONOBUOY_PID"

    - name: Diagnose sonobuoy on failure
      # cancelled() too: interrupting a hung run mid-debug (gh run cancel)
      # produces a "cancelled" conclusion, not "failure" -- without this,
      # exactly the scenario this step exists for would skip it.
      if: failure() || cancelled()
      env:
        KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
      shell: bash
      run: |
        echo "=== sonobuoy status ==="
        sonobuoy status --kubeconfig "$KUBECONFIG" || true
        echo "=== pods -n sonobuoy -o wide ==="
        kubectl get pods -n sonobuoy -o wide || true
        echo "=== services -n sonobuoy -o wide ==="
        kubectl get svc -n sonobuoy -o wide || true
        echo "=== describe pods -n sonobuoy ==="
        kubectl describe pods -n sonobuoy || true
        echo "=== events -n sonobuoy ==="
        kubectl get events -n sonobuoy --sort-by=.lastTimestamp || true

        # The sonobuoy results tarball (what "Retrieve sonobuoy results"
        # unpacks on the success path) is only written once the aggregator
        # finishes assembling results from a worker report it never got in
        # a hang like this -- it does not exist on disk yet, so these two
        # containers' own logs are the only place to see what actually
        # happened. Persisted to files (not just echoed) so they survive
        # into the "Upload logs on failure" artifact for offline reading.
        echo "=== aggregator pod logs (sonobuoy/sonobuoy) ==="
        kubectl logs -n sonobuoy sonobuoy | tee /tmp/sonobuoy-aggregator.log || true

        E2E_POD=$(kubectl get pods -n sonobuoy -l sonobuoy-component=plugin -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
        if [ -n "$E2E_POD" ]; then
          echo "=== e2e-job pod ($E2E_POD) -- e2e container logs (the actual ginkgo run) ==="
          kubectl logs -n sonobuoy "$E2E_POD" -c e2e | tee /tmp/sonobuoy-e2e-container.log || true
          echo "=== e2e-job pod ($E2E_POD) -- sonobuoy-worker container logs (result reporting) ==="
          kubectl logs -n sonobuoy "$E2E_POD" -c sonobuoy-worker | tee /tmp/sonobuoy-worker-container.log || true
        else
          echo "no e2e-job pod found (label sonobuoy-component=plugin)"
        fi

        # u7s bootstraps metrics-server (kube-system) on every run regardless
        # of this workflow. A prior run showed its readinessProbe failing
        # with HTTP 500 the whole time -- that's metrics-server's own /readyz
        # self-reporting a failed kubelet scrape, a different symptom of the
        # same "pod trying to reach something over the network" class of
        # problem this diagnose step already exists for, so capture its logs
        # too rather than assuming it's unrelated noise.
        echo "=== kube-system pods -o wide ==="
        kubectl get pods -n kube-system -o wide || true
        echo "=== metrics-server logs ==="
        kubectl logs -n kube-system -l k8s-app=metrics-server --tail=200 | tee /tmp/metrics-server.log || true
        echo "=== metrics-server describe ==="
        kubectl describe pod -n kube-system -l k8s-app=metrics-server || true

        echo "=== kube-proxy pod logs ==="
        kubectl logs -n kube-system -l k8s-app=kube-proxy --tail=50 || true
        for unit in u7s-apiserver u7s-kcm kubelet crio; do
          sudo journalctl -u "$unit" --no-pager --utc > "temp/u7s/$unit.log" 2>&1 || true
        done
        echo "=== iptables nat rules (KUBE-SERVICES/KUBE-SVC chains) ==="
        sudo iptables -t nat -S | grep -i "10.96.0.1\|KUBE-SERVICES\|KUBE-SVC" || true

        # Captures the flannel DS pod's own state -- sonobuoy sandboxes have
        # failed the flannel CNI plugin with subnet.env missing while CoreDNS
        # landed on a different subnet entirely, and this diagnose step had no
        # visibility into kube-flannel at all when that happened.
        echo "=== kube-flannel pods -o wide ==="
        kubectl -n kube-flannel get pods -o wide || true
        echo "=== kube-flannel pod logs ==="
        kubectl -n kube-flannel logs -l app=flannel --all-containers --prefix || true
        echo "=== /run/flannel/subnet.env ==="
        cat /run/flannel/subnet.env 2>&1 || true
        echo "=== /etc/cni/net.d ==="
        ls -la /etc/cni/net.d || true

    - name: Retrieve sonobuoy results
      env:
        KUBECONFIG: ${{ github.workspace }}/temp/u7s/kubeconfig
      shell: bash
      run: |
        TARBALL_NAME=$(kubectl logs -n sonobuoy sonobuoy | grep "Results available at" | tail -1 | grep -oE '[^ /]+\.tar\.gz' || true)
        if [ -z "$TARBALL_NAME" ]; then
          echo "ERROR: could not find results tarball name in sonobuoy logs" >&2
          exit 1
        fi
        POD_UID=$(kubectl get pod -n sonobuoy sonobuoy -o jsonpath='{.metadata.uid}')
        # sonobuoy retrieve relies on the port-forward subresource, which
        # 06-run-sonobuoy.sh's own comment notes u7s does not yet support
        # reliably -- read the results tarball straight off the kubelet's
        # emptyDir volume on disk instead, same as that script's lima
        # workaround minus the VM hop (kubelet runs on this same runner).
        HOST_PATH=$(sudo find "/var/lib/kubelet/pods/${POD_UID}/volumes/kubernetes.io~empty-dir" -name "$TARBALL_NAME" | head -1)
        if [ -z "$HOST_PATH" ]; then
          echo "ERROR: results tarball not found under kubelet pod volume for uid=${POD_UID}" >&2
          exit 1
        fi
        sudo cp "$HOST_PATH" /tmp/sonobuoy-results.tar.gz
        sudo chmod 644 /tmp/sonobuoy-results.tar.gz
        mkdir -p /tmp/sonobuoy-results
        tar xzf /tmp/sonobuoy-results.tar.gz -C /tmp/sonobuoy-results

    - name: Assert sonobuoy PASS
      env:
        EXPECTED_SPECS: ${{ inputs.expected_specs }}
      shell: bash
      run: |
        E2E_TXT=$(find /tmp/sonobuoy-results/podlogs -name "e2e.txt" | head -1)
        if [ -z "$E2E_TXT" ]; then
          echo "ERROR: e2e.txt not found under podlogs/**/logs/ in the sonobuoy results" >&2
          find /tmp/sonobuoy-results -maxdepth 4 >&2
          exit 1
        fi
        echo "=== e2e.txt tail ==="
        tail -40 "$E2E_TXT"

        RAN_LINE=$(grep -E "^Ran [0-9]+ of [0-9]+ Specs" "$E2E_TXT" | tail -1 || true)
        echo "Ginkgo ran-count: $RAN_LINE"
        # Exactly EXPECTED_SPECS -- not zero (the focus regex silently matched
        # nothing, e.g. a FeatureGate label filter or a typo) and not more (the
        # focus regex over-matched an unrelated spec).
        if ! echo "$RAN_LINE" | grep -qE "^Ran ${EXPECTED_SPECS} of "; then
          echo "ERROR: expected exactly ${EXPECTED_SPECS} specs to run; got: $RAN_LINE" >&2
          exit 1
        fi

        SUMMARY_LINE=$(grep -E "^SUCCESS!|^FAIL!" "$E2E_TXT" | tail -1 || true)
        echo "Ginkgo summary: $SUMMARY_LINE"
        if ! echo "$SUMMARY_LINE" | grep -q "^SUCCESS!"; then
          echo "ERROR: sonobuoy did not report SUCCESS in e2e.txt (summary: $SUMMARY_LINE)" >&2
          exit 1
        fi
        if ! echo "$SUMMARY_LINE" | grep -q "0 Failed"; then
          echo "ERROR: sonobuoy reported failures in e2e.txt (summary: $SUMMARY_LINE)" >&2
          exit 1
        fi
        echo "PASS: $RAN_LINE / $SUMMARY_LINE"

    - name: Sample peak RSS
      shell: bash
      run: |
        APISERVER_PID=$(systemctl show -p MainPID --value u7s-apiserver)
        APISERVER_RSS=$(ps -o rss= -p "$APISERVER_PID" | tr -d ' ')
        DELTA=$(( APISERVER_RSS - BASELINE_APISERVER_RSS_KB ))
        read -r MEM_TOTAL MEM_USED MEM_FREE <<< "$(free -m | awk '/^Mem:/{print $2, $3, $4}')"
        {
          echo "### RSS peak (k8s ${{ inputs.k8s_version }}, after sonobuoy)"
          echo "- apiserver RSS (scheduler embedded): ${APISERVER_RSS} kB (baseline ${BASELINE_APISERVER_RSS_KB} kB)"
          echo "- delta vs. baseline: ${DELTA} kB, threshold: 10240 kB"
          echo "- runner memory (free -m): total=${MEM_TOTAL}MB used=${MEM_USED}MB free=${MEM_FREE}MB"
        } | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$DELTA" -gt 10240 ]; then
          echo "FAIL: peak RSS delta ${DELTA} kB exceeds 10240 kB (10 MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Stop stack
      if: always()
      shell: bash
      run: |
        sudo systemctl stop kubelet u7s-kcm u7s-apiserver 2>/dev/null || true

    - name: Upload logs on failure
      # cancelled() too -- confirmed live that a manual `gh run cancel`
      # (used to interrupt a hang instead of waiting out the full job
      # timeout) produces a "cancelled" job conclusion, which a bare
      # if: failure() does not match, so this step silently skipped on
      # exactly the runs it exists to capture logs for.
      if: failure() || cancelled()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.run_label }}-logs-${{ inputs.k8s_version }}
        path: |
          temp/u7s/run-meta
          temp/u7s/u7s-apiserver.log
          temp/u7s/u7s-kcm.log
          temp/u7s/kubelet.log
          temp/u7s/crio.log
          /tmp/sonobuoy-results.tar.gz
          /tmp/sonobuoy-aggregator.log
          /tmp/sonobuoy-e2e-container.log
          /tmp/sonobuoy-worker-container.log
          /tmp/metrics-server.log
